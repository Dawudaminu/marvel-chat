<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6D28D9">
  <meta name="description" content="Marvel Chat — Chat. Connect. Trade Your Time.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- GitHub Pages /marvel-chat/ compatible PWA paths -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Marvel Chat</title>

  <style>
    :root{
      --primary:#6D28D9;
      --primary-2:#8B5CF6;
      --primary-dark:#4C1D95;
      --soft:#F0E9FF;
      --bg:#F7F7FB;
      --surface:#FFFFFF;
      --surface-2:#F0EEF5;
      --text:#17131F;
      --muted:#756E80;
      --border:#E5E0EA;
      --success:#16803C;
      --danger:#C62828;
      --warning:#A16207;
      --shadow:0 10px 30px rgba(40,20,80,.08);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .hidden{
      display:none!important;
    }

    .app{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      height:64px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand-logo{
      width:40px;
      height:40px;
      border-radius:13px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:white;
      display:grid;
      place-items:center;
      font-weight:900;
      box-shadow:0 8px 20px rgba(109,40,217,.25);
    }

    .brand-name{
      font-weight:900;
      font-size:17px;
      white-space:nowrap;
    }

    .brand-sub{
      color:var(--muted);
      font-size:11px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      border:1px solid var(--border);
      background:var(--surface);
      border-radius:13px;
      display:grid;
      place-items:center;
      color:var(--text);
    }

    .icon-btn:hover{
      background:var(--soft);
    }

    .main{
      width:min(1100px,100%);
      margin:0 auto;
      padding:18px 14px 100px;
      flex:1;
    }

    .page{
      animation:fadeIn .18s ease;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(4px)}
      to{opacity:1;transform:none}
    }

    .hero{
      background:linear-gradient(135deg,#6D28D9,#8B5CF6);
      color:white;
      border-radius:26px;
      padding:24px;
      box-shadow:0 18px 45px rgba(76,29,149,.22);
      margin-bottom:18px;
    }

    .hero h1{
      margin:0 0 7px;
      font-size:clamp(24px,6vw,36px);
      line-height:1.05;
    }

    .hero p{
      margin:0;
      opacity:.9;
      line-height:1.55;
    }

    .grid{
      display:grid;
      gap:14px;
    }

    .grid-2{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .grid-3{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:17px;
    }

    .card h2,
    .card h3{
      margin:0 0 8px;
    }

    .small{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .muted{
      color:var(--muted);
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:22px 0 11px;
    }

    .section-title h2{
      margin:0;
      font-size:19px;
    }

    .btn{
      border:0;
      border-radius:13px;
      padding:11px 15px;
      font-weight:800;
      transition:.15s;
    }

    .btn:active{
      transform:scale(.98);
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .btn-secondary{
      background:var(--soft);
      color:var(--primary-dark);
    }

    .btn-danger{
      background:#FDECEC;
      color:var(--danger);
    }

    .btn-ghost{
      background:transparent;
      color:var(--primary);
      border:1px solid var(--border);
    }

    .btn-block{
      width:100%;
    }

    .input,
    .textarea,
    .select{
      width:100%;
      border:1px solid var(--border);
      background:#fff;
      border-radius:13px;
      padding:12px 13px;
      outline:none;
      color:var(--text);
    }

    .input:focus,
    .textarea:focus,
    .select:focus{
      border-color:var(--primary-2);
      box-shadow:0 0 0 3px rgba(139,92,246,.12);
    }

    .textarea{
      resize:vertical;
      min-height:100px;
    }

    .field{
      margin-bottom:13px;
    }

    .field label{
      display:block;
      font-size:13px;
      font-weight:800;
      margin-bottom:6px;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:110;
      height:70px;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--border);
      display:flex;
      justify-content:center;
    }

    .bottom-inner{
      width:min(700px,100%);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      align-items:center;
    }

    .nav-btn{
      border:0;
      background:transparent;
      color:var(--muted);
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-size:11px;
      font-weight:700;
    }

    .nav-btn.active{
      color:var(--primary);
    }

    .nav-icon{
      font-size:21px;
      line-height:1;
    }

    .auth-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(circle at top left,rgba(139,92,246,.2),transparent 40%),
        radial-gradient(circle at bottom right,rgba(109,40,217,.16),transparent 40%),
        var(--bg);
    }

    .auth-card{
      width:min(460px,100%);
      background:#fff;
      border:1px solid var(--border);
      border-radius:28px;
      padding:24px;
      box-shadow:0 25px 70px rgba(35,20,60,.12);
    }

    .auth-logo{
      width:66px;
      height:66px;
      border-radius:21px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;
      display:grid;
      place-items:center;
      font-size:28px;
      font-weight:900;
      margin-bottom:16px;
    }

    .auth-card h1{
      margin:0 0 7px;
      font-size:28px;
    }

    .auth-card p{
      color:var(--muted);
      line-height:1.5;
    }

    .status{
      border-radius:12px;
      padding:11px 13px;
      font-size:13px;
      margin:10px 0;
    }

    .status.error{
      background:#FFF0F0;
      color:var(--danger);
    }

    .status.success{
      background:#ECFDF3;
      color:var(--success);
    }

    .status.info{
      background:#F0E9FF;
      color:var(--primary-dark);
    }

    .profile-row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      background:var(--soft);
      color:var(--primary);
      display:grid;
      place-items:center;
      font-weight:900;
      flex:none;
    }

    .avatar-lg{
      width:76px;
      height:76px;
      font-size:24px;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-meta strong{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .post{
      margin-bottom:14px;
    }

    .post-head{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .post-body{
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .post-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
      padding-top:11px;
      border-top:1px solid var(--border);
    }

    .action{
      border:0;
      background:var(--surface-2);
      color:var(--text);
      border-radius:11px;
      padding:8px 11px;
      font-size:12px;
      font-weight:700;
    }

    .action.active{
      background:var(--soft);
      color:var(--primary);
    }

    .chat-list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .chat-item{
      display:flex;
      align-items:center;
      gap:11px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:15px;
      background:#fff;
      cursor:pointer;
    }

    .chat-item:hover{
      background:var(--soft);
    }

    .chat-content{
      flex:1;
      min-width:0;
    }

    .chat-content strong,
    .chat-content p{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      display:block;
    }

    .chat-content p{
      margin:4px 0 0;
      font-size:12px;
      color:var(--muted);
    }

    .message-box{
      display:flex;
      gap:8px;
      position:sticky;
      bottom:78px;
      background:var(--bg);
      padding-top:10px;
    }

    .message-box input{
      flex:1;
    }

    .messages{
      min-height:350px;
      max-height:60vh;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:4px 0;
    }

    .bubble{
      max-width:82%;
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
      align-self:flex-start;
      line-height:1.45;
    }

    .bubble.mine{
      align-self:flex-end;
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }

    .bubble-time{
      font-size:10px;
      opacity:.65;
      margin-top:4px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .list-item{
      border:1px solid var(--border);
      border-radius:14px;
      padding:13px;
      background:#fff;
    }

    .list-item strong{
      display:block;
      margin-bottom:3px;
    }

    .stat{
      padding:15px;
      border-radius:16px;
      background:var(--soft);
    }

    .stat strong{
      display:block;
      font-size:25px;
      color:var(--primary-dark);
    }

    .search{
      display:flex;
      gap:8px;
      margin-bottom:14px;
    }

    .search input{
      flex:1;
    }

    .empty{
      text-align:center;
      padding:35px 15px;
      color:var(--muted);
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(15,10,25,.5);
      z-index:500;
      display:grid;
      place-items:center;
      padding:15px;
    }

    .modal{
      width:min(520px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:24px;
      padding:20px;
      box-shadow:0 30px 100px rgba(0,0,0,.25);
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:15px;
    }

    .modal-head h2{
      margin:0;
      font-size:20px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:85px;
      transform:translateX(-50%);
      z-index:700;
      background:#17131F;
      color:#fff;
      border-radius:12px;
      padding:11px 15px;
      font-size:13px;
      box-shadow:0 12px 30px rgba(0,0,0,.2);
      max-width:90%;
      text-align:center;
    }

    .loader{
      width:25px;
      height:25px;
      border:3px solid #ddd;
      border-top-color:var(--primary);
      border-radius:50%;
      animation:spin .7s linear infinite;
      margin:auto;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .online{
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--success);
      display:inline-block;
    }

    .offline{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#999;
      display:inline-block;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 8px;
      border-radius:999px;
      background:var(--soft);
      color:var(--primary-dark);
      font-size:11px;
      font-weight:800;
    }

    .country-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .country-option{
      border:1px solid var(--border);
      background:#fff;
      border-radius:13px;
      padding:12px;
      text-align:left;
      font-weight:700;
    }

    .country-option.selected{
      border-color:var(--primary);
      background:var(--soft);
      color:var(--primary-dark);
    }

    @media(max-width:650px){
      .grid-3{
        grid-template-columns:1fr;
      }

      .grid-2{
        grid-template-columns:1fr;
      }

      .hero{
        border-radius:21px;
      }

      .main{
        padding-left:11px;
        padding-right:11px;
      }
    }

    @media(min-width:700px){
      .bottom-nav{
        position:fixed;
        width:calc(100% - 28px);
        left:14px;
        right:14px;
        bottom:12px;
        max-width:1100px;
        margin:auto;
        border:1px solid var(--border);
        border-radius:20px;
        box-shadow:0 15px 40px rgba(20,10,40,.12);
        overflow:hidden;
      }

      .main{
        padding-bottom:105px;
      }
    }
  </style>
</head>

<body>

<div id="root">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo">M</div>
      <h1>Marvel Chat</h1>
      <p>Loading your account…</p>
      <div class="loader"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
  /*
   * ============================================================
   * MARVEL CHAT
   * Production frontend
   *
   * Firebase services used:
   *   - Authentication
   *   - Cloud Firestore
   *
   * Firebase Storage is intentionally NOT used.
   *
   * External project files:
   *   ./firebaseconfig.js
   *   ./manifest.json
   *   ./serviceworker.js
   * ============================================================
   */

  import { firebaseConfig } from "./firebaseconfig.js";

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    addDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    limit,
    getDocs,
    onSnapshot,
    serverTimestamp,
    increment
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  /*
   * IMPORTANT:
   * There is deliberately NO:
   *
   * import { getStorage } ...
   * getStorage()
   * uploadBytes()
   * getDownloadURL()
   *
   * This application does not depend on Firebase Storage.
   */

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const state = {
    user: null,
    profile: null,
    page: "home",
    posts: [],
    chats: [],
    activeChat: null,
    messages: [],
    unsubscribePosts: null,
    unsubscribeMessages: null,
    unsubscribeChats: null,
    loading: false,
    search: "",
    lowData: localStorage.getItem("marvel_low_data") === "1",
    theme: localStorage.getItem("marvel_theme") || "light"
  };

  const root = document.getElementById("root");
  const modalRoot = document.getElementById("modalRoot");
  const toastRoot = document.getElementById("toastRoot");

  const countries = [
    ["NG","🇳🇬 Nigeria"],
    ["GH","🇬🇭 Ghana"],
    ["KE","🇰🇪 Kenya"],
    ["ZA","🇿🇦 South Africa"],
    ["US","🇺🇸 United States"],
    ["GB","🇬🇧 United Kingdom"],
    ["CA","🇨🇦 Canada"],
    ["IN","🇮🇳 India"],
    ["OTHER","🌍 Other"]
  ];

  function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function initials(name){
    const text = String(name || "User").trim();
    return text
      .split(/\s+/)
      .slice(0,2)
      .map(x => x[0]?.toUpperCase() || "")
      .join("") || "U";
  }

  function formatDate(value){
    if(!value) return "";
    const date = value?.toDate ? value.toDate() : new Date(value);
    if(Number.isNaN(date.getTime())) return "";
    return date.toLocaleString([],{
      day:"numeric",
      month:"short",
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  function toast(message){
    toastRoot.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
    setTimeout(() => {
      toastRoot.innerHTML = "";
    },2800);
  }

  function showModal(title, body){
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <div class="modal-head">
            <h2>${escapeHtml(title)}</h2>
            <button class="icon-btn" id="closeModal">✕</button>
          </div>
          ${body}
        </div>
      </div>
    `;

    document.getElementById("closeModal")?.addEventListener("click",closeModal);

    document.getElementById("modalBackdrop")?.addEventListener("click",e=>{
      if(e.target.id === "modalBackdrop") closeModal();
    });
  }

  function closeModal(){
    modalRoot.innerHTML = "";
  }

  function setLoading(value){
    state.loading = value;
  }

  function applyTheme(){
    document.documentElement.dataset.theme = state.theme;

    if(state.theme === "dark"){
      document.documentElement.style.setProperty("--bg","#111016");
      document.documentElement.style.setProperty("--surface","#191720");
      document.documentElement.style.setProperty("--surface-2","#25212D");
      document.documentElement.style.setProperty("--text","#F8F5FC");
      document.documentElement.style.setProperty("--muted","#B4ACBF");
      document.documentElement.style.setProperty("--border","#342D3E");
    }else{
      document.documentElement.style.setProperty("--bg","#F7F7FB");
      document.documentElement.style.setProperty("--surface","#FFFFFF");
      document.documentElement.style.setProperty("--surface-2","#F0EEF5");
      document.documentElement.style.setProperty("--text","#17131F");
      document.documentElement.style.setProperty("--muted","#756E80");
      document.documentElement.style.setProperty("--border","#E5E0EA");
    }
  }

  applyTheme();

  function saveTheme(theme){
    state.theme = theme;
    localStorage.setItem("marvel_theme",theme);
    applyTheme();
    render();
  }

  function saveLowData(value){
    state.lowData = value;
    localStorage.setItem("marvel_low_data",value ? "1" : "0");
  }

  function friendlyFirebaseError(error){
    const code = error?.code || "";

    const messages = {
      "auth/email-already-in-use":"This email is already registered.",
      "auth/invalid-email":"Please enter a valid email address.",
      "auth/weak-password":"Password must be at least 6 characters.",
      "auth/invalid-credential":"Incorrect email or password.",
      "auth/user-not-found":"No account was found with this email.",
      "auth/wrong-password":"Incorrect password.",
      "auth/network-request-failed":"Network connection failed. Check your internet.",
      "auth/too-many-requests":"Too many attempts. Please wait and try again."
    };

    return messages[code] || error?.message || "Something went wrong.";
  }

  function renderAuth(mode="login",message=""){
    root.innerHTML = `
      <div class="auth-shell">
        <div class="auth-card">
          <div class="auth-logo">M</div>

          <h1>Marvel Chat</h1>
          <p>
            Connect with people, chat, trade your time and discover opportunities.
          </p>

          ${message ? `
            <div class="status error">${escapeHtml(message)}</div>
          ` : ""}

          <div class="field">
            <label>Email</label>
            <input
              id="authEmail"
              class="input"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            >
          </div>

          <div class="field">
            <label>Password</label>
            <input
              id="authPassword"
              class="input"
              type="password"
              autocomplete="${mode === "login" ? "current-password" : "new-password"}"
              placeholder="••••••••"
            >
          </div>

          ${mode === "register" ? `
            <div class="field">
              <label>Username</label>
              <input
                id="authUsername"
                class="input"
                type="text"
                autocomplete="username"
                placeholder="Choose a username"
              >
            </div>

            <div class="field">
              <label>Phone number</label>
              <input
                id="authPhone"
                class="input"
                type="tel"
                autocomplete="tel"
                placeholder="+234..."
              >
            </div>
          ` : ""}

          <button class="btn btn-primary btn-block" id="authSubmit">
            ${mode === "login" ? "Sign in" : "Create account"}
          </button>

          <div style="height:10px"></div>

          <button class="btn btn-ghost btn-block" id="authSwitch">
            ${mode === "login"
              ? "Create a new account"
              : "I already have an account"}
          </button>

          <p class="small" style="margin-top:15px">
            By continuing, you agree to use Marvel Chat responsibly.
          </p>
        </div>
      </div>
    `;

    document.getElementById("authSubmit")?.addEventListener("click",async()=>{
      const email = document.getElementById("authEmail")?.value.trim();
      const password = document.getElementById("authPassword")?.value;

      if(!email || !password){
        renderAuth(mode,"Please enter your email and password.");
        return;
      }

      try{
        setLoading(true);

        if(mode === "login"){
          await signInWithEmailAndPassword(auth,email,password);
        }else{
          const username = document.getElementById("authUsername")?.value.trim();
          const phone = document.getElementById("authPhone")?.value.trim();

          if(!username){
            renderAuth(mode,"Username is required.");
            return;
          }

          if(!phone){
            renderAuth(mode,"Phone number is required.");
            return;
          }

          const credential =
            await createUserWithEmailAndPassword(auth,email,password);

          await updateProfile(credential.user,{
            displayName:username
          });

          await setDoc(
            doc(db,"users",credential.user.uid),
            {
              uid:credential.user.uid,
              username,
              displayName:username,
              email,
              phone,
              country:null,
              onboardingComplete:false,
              createdAt:serverTimestamp(),
              updatedAt:serverTimestamp()
            },
            {merge:true}
          );
        }
      }catch(error){
        console.error(error);
        renderAuth(mode,friendlyFirebaseError(error));
      }finally{
        setLoading(false);
      }
    });

    document.getElementById("authSwitch")?.addEventListener("click",()=>{
      renderAuth(mode === "login" ? "register" : "login");
    });
  }

  async function loadProfile(user){
    const ref = doc(db,"users",user.uid);
    const snap = await getDoc(ref);

    if(snap.exists()){
      state.profile = {
        uid:user.uid,
        ...snap.data()
      };
    }else{
      state.profile = {
        uid:user.uid,
        username:user.displayName || "User",
        displayName:user.displayName || "User",
        email:user.email || "",
        phone:"",
        country:null,
        onboardingComplete:false
      };

      await setDoc(ref,{
        ...state.profile,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      },{merge:true});
    }
  }

  async function toggleLike(postId){
    try{
      const post = state.posts.find(x=>x.id === postId);
      if(!post) return;

      const likedBy = Array.isArray(post.likedBy)
        ? [...post.likedBy]
        : [];

      const index = likedBy.indexOf(state.user.uid);

      if(index >= 0){
        likedBy.splice(index,1);
      }else{
        likedBy.push(state.user.uid);
      }

      await updateDoc(doc(db,"posts",postId),{
        likedBy,
        likes:likedBy.length
      });
    }catch(error){
      console.error(error);
      toast("Could not update like.");
    }
  }

  async function savePost(postId){
    try{
      await setDoc(
        doc(db,"users",state.user.uid,"savedPosts",postId),
        {
          postId,
          savedAt:serverTimestamp()
        },
        {merge:true}
      );

      toast("Could not save post.");

  async function sharePost(postId){
    const url = `${location.origin}${location.pathname}#post=${postId}`;

    try{
      if(navigator.share){
        await navigator.share({
          title:"Marvel Chat",
          text:"Check this post on Marvel Chat.",
          url
        });
      }else{
        await navigator.clipboard.writeText(url);
        toast("Post link copied.");
      }
    }catch(error){
      if(error?.name !== "AbortError"){
        toast("Could not share post.");
      }
    }

  async function createOrOpenChat(other){
    const members = [state.user.uid,other.uid].sort();

    try{
      const q = query(
        collection(db,"chats"),
        where("members","==",members),
        limit(1)
      );

      const snap = await getDocs(q);

      if(!snap.empty){
        closeModal();
        await openChat(snap.docs[0].id);
        return;
      }

      const memberNames = {
        [state.user.uid]:
          state.profile.displayName ||
          state.profile.username ||
          "User",
        [other.uid]:
          other.displayName ||
          other.username ||
          "User"
      };

      const ref = await addDoc(collection(db,"chats"),{
        members,
        memberNames,
        lastMessage:"",
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });

      closeModal();
      await openChat(ref.id);
    }catch(error){
      console.error(error);
      toast("Could not create chat.");
    }
  }

  async function openChat(chatId){
    state.activeChat = chatId;
    state.messages = [];

    if(state.unsubscribeMessages){
      state.unsubscribeMessages();
      state.unsubscribeMessages = null;
    }

    render();

    const messagesQuery = query(
      collection(db,"chats",chatId,"messages"),
      orderBy("createdAt","asc"),
      limit(200)
    );

    state.unsubscribeMessages = onSnapshot(
      messagesQuery,
      snap=>{
        state.messages = snap.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

        renderConversationOnly();
      },
      error=>{
        console.error(error);
        toast("Could not load messages.");
      }
    );
  }

  function renderMessages(){
    if(!state.messages.length){
      return `<div class="empty">Start the conversation.</div>`;
    }

    return state.messages.map(message=>{
      const mine = message.uid === state.user.uid;

      return `
        <div class="bubble ${mine ? "mine" : ""}">
          <div>${escapeHtml(message.text || "")}</div>
          <div class="bubble-time">
            ${escapeHtml(formatDate(message.createdAt))}
          </div>

  function renderConversationOnly(){
    const messages = document.getElementById("messages");

    if(messages){
      messages.innerHTML = renderMessages();
      messages.scrollTop = messages.scrollHeight;
    }

  async function sendMessage(){
    const input = document.getElementById("messageInput");
    const text = input?.value.trim();

    if(!text || !state.activeChat) return;

    try{
      input.value = "";

      await addDoc(
        collection(db,"chats",state.activeChat,"messages"),
        {
          uid:state.user.uid,
          text,
          createdAt:serverTimestamp()
        }
      );

      await updateDoc(doc(db,"chats",state.activeChat),{
        lastMessage:text,
        updatedAt:serverTimestamp()
      });

    }catch(error){
      console.error(error);
      toast("Could not send message.");
    }

          <h3>Offer a skill</h3>
          <p class="small">
            Tell people what you can help them learn or do.
          </p>
          <button class="btn btn-primary" id="offerSkillBtn">
            Offer skill
          </button>
        </div>

        <div class="card">
          <h3>Request help</h3>
          <p class="small">
            Ask the community for a skill or service.
          </p>
          <button class="btn btn-secondary" id="requestSkillBtn">
            Request help
          </button>
        </div>
      </div>

      <div class="section-title">
        <h2>TimeTrust activity</h2>
      </div>

      <div class="card">
        <div class="list">
          <div class="list-item">
            <strong>1 hour = 1 time credit</strong>
            <span class="small">
              Keep exchanges simple and community-focused.
            </span>
          </div>

          <div class="list-item">
            <strong>Be respectful</strong>
            <span class="small">
              Only offer services you are genuinely able to provide.
            </span>
          </div>

          <div class="list-item">
            <strong>Keep communication inside Marvel Chat</strong>
            <span class="small">
              Use chat to agree on the time and details.
            </span>
          </div>
        </div>
      </div>
    `;
  }

  function showSkillModal(type){
    const title =
      type === "offer"
        ? "Offer a skill"
        : "Request help";

    showModal(title,`
      <div class="field">
        <label>Title</label>
        <input id="skillTitle" class="input" placeholder="e.g. Mathematics help">
      </div>

      <div class="field">
        <label>Description</label>
        <textarea
          id="skillDescription"
          class="textarea"
          placeholder="Explain what you can offer or what you need."
        ></textarea>
      </div>

      <div class="field">
        <label>Time in hours</label>
        <input
          id="skillHours"
          class="input"
          type="number"
          min="1"
          max="100"
          value="1"
        >
      </div>

      <button class="btn btn-primary btn-block" id="publishSkill">
        Publish
      </button>
    `);

    document.getElementById("publishSkill")?.addEventListener("click",async()=>{
      const title = document.getElementById("skillTitle")?.value.trim();
      const description = document.getElementById("skillDescription")?.value.trim();
      const hours = Number(document.getElementById("skillHours")?.value || 1);

      if(!title || !description){
        toast("Complete the form first.");
        return;
      }

      try{
        await addDoc(collection(db,"timetrust"),{
          uid:state.user.uid,
          username:
            state.profile.displayName ||
            state.profile.username ||
            "User",
          type,
          title,
          description,
          hours,
          country:state.profile.country || null,
          status:"open",
          createdAt:serverTimestamp()
        });

        closeModal();
        toast("TimeTrust listing published.");
      }catch(error){
        console.error(error);
        toast("Could not publish listing.");
      }
    });
  }

  function renderMarketPage(){
    return `
      <section class="hero">
        <h1>Market 🛍</h1>
        <p>
          Discover products and services shared by the community.
        </p>
      </section>

      <div class="card">
        <div class="search">
          <input
            id="marketSearch"
            class="input"
            placeholder="Search marketplace..."
          >
          <button class="btn btn-primary" id="sellBtn">
            + Sell
          </button>
        </div>

        <div id="marketItems">
          <div class="empty">
            Marketplace listings will appear here.
          </div>
        </div>
      </div>
    `;
  }

  function showSellModal(){
    showModal("Create marketplace listing",`
      <div class="field">
        <label>Product or service</label>
        <input id="marketTitle" class="input" placeholder="What are you offering?">
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="marketDescription" class="textarea"></textarea>
      </div>

      <div class="field">
        <label>Price</label>
        <input
          id="marketPrice"
          class="input"
          type="number"
          min="0"
          placeholder="0"
        >
      </div>

      <button class="btn btn-primary btn-block" id="publishMarket">
        Publish listing
      </button>
    `);

    document.getElementById("publishMarket")?.addEventListener("click",async()=>{
      const title = document.getElementById("marketTitle")?.value.trim();
      const description = document.getElementById("marketDescription")?.value.trim();
      const price = Number(document.getElementById("marketPrice")?.value || 0);

      if(!title || !description){
        toast("Complete the listing.");
        return;
      }

      try{
        await addDoc(collection(db,"marketplace"),{
          uid:state.user.uid,
          username:
            state.profile.displayName ||
            state.profile.username ||
            "User",
          title,
          description,
          price,
          country:state.profile.country || null,
          status:"active",
          createdAt:serverTimestamp()
        });

        closeModal();
        toast("Listing published.");
      }catch(error){
        console.error(error);
        toast("Could not publish listing.");
      }
    });
  }

  function renderProfilePage(){
    const name =
      state.profile?.displayName ||
      state.profile?.username ||
      "User";

    return `
      <section class="hero">
        <div class="profile-row">
          <div class="avatar avatar-lg">
            ${escapeHtml(initials(name))}
          </div>

          <div>
            <h1>${escapeHtml(name)}</h1>
            <p>
              ${escapeHtml(state.user?.email || "")}
            </p>
          </div>
        </div>
      </section>

      <div class="grid grid-2">
        <div class="card">
          <h3>Account</h3>

          <div class="list">
            <div class="list-item">
              <strong>Username</strong>
              <span class="small">
                ${escapeHtml(state.profile?.username || "—")}
              </span>
            </div>

            <div class="list-item">
              <strong>Phone</strong>
              <span class="small">
                ${escapeHtml(state.profile?.phone || "—")}
              </span>
            </div>

            <div class="list-item">
              <strong>Country</strong>
              <span class="small">
                ${escapeHtml(state.profile?.country || "—")}
              </span>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>Settings</h3>

          <button class="btn btn-secondary btn-block" id="editProfileBtn">
            Edit profile
          </button>

          <div style="height:8px"></div>

          <button class="btn btn-secondary btn-block" id="settingsBtn">
            App settings
          </button>

          <div style="height:8px"></div>

          <button class="btn btn-danger btn-block" id="logoutBtn">
            Sign out
          </button>
        </div>
      </div>
    `;
  }

  function showEditProfile(){
    showModal("Edit profile",`
      <div class="field">
        <label>Display name</label>
        <input
          id="editName"
          class="input"
          value="${escapeHtml(
            state.profile.displayName ||
            state.profile.username ||
            ""
          )}"
        >
      </div>

      <div class="field">
        <label>Phone</label>
        <input
          id="editPhone"
          class="input"
          value="${escapeHtml(state.profile.phone || "")}"
        >
      </div>

      <button class="btn btn-primary btn-block" id="saveProfile">
        Save changes
      </button>
    `);

    document.getElementById("saveProfile")?.addEventListener("click",async()=>{
      const displayName = document.getElementById("editName")?.value.trim();
      const phone = document.getElementById("editPhone")?.value.trim();

      if(!displayName){
        toast("Display name cannot be empty.");
        return;
      }

      try{
        await updateProfile(auth.currentUser,{displayName});

        await updateDoc(doc(db,"users",state.user.uid),{
          displayName,
          phone,
          updatedAt:serverTimestamp()
        });

        state.profile.displayName = displayName;
        state.profile.phone = phone;

        closeModal();
        render();
        toast("Profile updated.");
      }catch(error){
        console.error(error);
        toast("Could not update profile.");
      }
    });
  }

  function showSettings(){
    showModal("Settings",`
      <div class="list">
        <div class="list-item">
          <strong>Theme</strong>

          <div style="display:flex;gap:8px;margin-top:9px">
            <button
              class="btn ${state.theme === "light" ? "btn-primary" : "btn-secondary"}"
              id="lightTheme"
            >
              Light
            </button>

            <button
              class="btn ${state.theme === "dark" ? "btn-primary" : "btn-secondary"}"
              id="darkTheme"
            >
              Dark
            </button>
          </div>
        </div>

        <div class="list-item">
          <strong>Low-data mode</strong>

          <p class="small">
            Reduces unnecessary background activity.
          </p>

          <button class="btn btn-secondary" id="lowDataToggle">
            ${state.lowData ? "Disable" : "Enable"}
          </button>
        </div>

        <div class="list-item">
          <strong>PWA</strong>
          <p class="small">
            manifest.json + serviceworker.js
          </p>
        </div>
      </div>
    `);

    document.getElementById("lightTheme")?.addEventListener("click",()=>{
      saveTheme("light");
      closeModal();
    });

    document.getElementById("darkTheme")?.addEventListener("click",()=>{
      saveTheme("dark");
      closeModal();
    });

    document.getElementById("lowDataToggle")?.addEventListener("click",()=>{
      saveLowData(!state.lowData);
      closeModal();
      toast(state.lowData ? "Low-data mode enabled." : "Low-data mode disabled.");
    });
  }

  function showSearch(){
    showModal("Search Marvel Chat",`
      <div class="field">
        <input
          id="globalSearch"
          class="input"
          placeholder="Search people, posts, marketplace..."
        >
      </div>

      <button class="btn btn-primary btn-block" id="runSearch">
        Search
      </button>

      <div id="searchResults" style="margin-top:15px"></div>
    `);

    document.getElementById("runSearch")?.addEventListener("click",async()=>{
      const term =
        document.getElementById("globalSearch")?.value.trim().toLowerCase();

      if(!term){
        return;
      }

      const results = state.posts.filter(post =>
        String(post.text || "").toLowerCase().includes(term) ||
        String(post.username || "").toLowerCase().includes(term)
      );

      document.getElementById("searchResults").innerHTML =
        results.length
        ? results.map(post=>`
            <div class="list-item">
              <strong>${escapeHtml(post.username || "User")}</strong>
              <div>${escapeHtml(post.text || "")}</div>
            </div>
          `).join("")
        : `<div class="empty">No matching posts found.</div>`;
    });
  }

  function showNotifications(){
    showModal("Notifications",`
      <div class="empty">
        <div style="font-size:30px">🔔</div>
        <p>No new notifications.</p>
      </div>
    `);
  }

  function attachPageEvents(){
    if(state.page === "home"){
      attachHomeEvents();
    }

    if(state.page === "chat"){
      if(state.activeChat){
        document.getElementById("backChats")?.addEventListener("click",()=>{
          if(state.unsubscribeMessages){
            state.unsubscribeMessages();
            state.unsubscribeMessages = null;
          }

          state.activeChat = null;
          state.messages = [];
          render();
        });

        document.getElementById("sendMessage")?.addEventListener("click",sendMessage);

        document.getElementById("messageInput")?.addEventListener("keydown",e=>{
          if(e.key === "Enter"){
            e.preventDefault();
            sendMessage();
          }
        });
      }else{
        attachChatEvents();
      }
    }

    if(state.page === "timetrust"){
      document.getElementById("offerSkillBtn")?.addEventListener(
        "click",
        ()=>showSkillModal("offer")
      );

      document.getElementById("requestSkillBtn")?.addEventListener(
        "click",
        ()=>showSkillModal("request")
      );
    }

    if(state.page === "market"){
      document.getElementById("sellBtn")?.addEventListener(
        "click",
        showSellModal
      );
    }

    if(state.page === "profile"){
      document.getElementById("editProfileBtn")?.addEventListener(
        "click",
        showEditProfile
      );

      document.getElementById("settingsBtn")?.addEventListener(
        "click",
        showSettings
      );

      document.getElementById("logoutBtn")?.addEventListener(
        "click",
        ()=>signOut(auth)
      );
    }
  }

  function subscribePosts(){
    if(state.unsubscribePosts){
      state.unsubscribePosts();
      state.unsubscribePosts = null;
    }

    const postsQuery = query(
      collection(db,"posts"),
      orderBy("createdAt","desc"),
      limit(50)
    );

    state.unsubscribePosts = onSnapshot(
      postsQuery,
      snap=>{
        state.posts = snap.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

        if(state.user && state.profile?.onboardingComplete){
          if(state.page === "home"){
            render();
          }
        }
      },
      error=>{
        console.error("Posts listener:",error);
      }
    );
  }

  function subscribeChats(){
    if(state.unsubscribeChats){
      state.unsubscribeChats();
      state.unsubscribeChats = null;
    }

    if(!state.user) return;

    const chatsQuery = query(
      collection(db,"chats"),
      where("members","array-contains",state.user.uid),
      orderBy("updatedAt","desc"),
      limit(50)
    );

    state.unsubscribeChats = onSnapshot(
      chatsQuery,
      snap=>{
        state.chats = snap.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

        if(state.page === "chat" && !state.activeChat){
          render();
        }
      },
      error=>{
        console.error("Chats listener:",error);
      }
    );
  }

  async function startApplication(user){
    state.user = user;

    try{
      await loadProfile(user);

      subscribePosts();
      subscribeChats();

      render();
    }catch(error){
      console.error(error);

      root.innerHTML = `
        <div class="auth-shell">
          <div class="auth-card">
            <div class="auth-logo">!</div>

            <h1>Connection problem</h1>

            <p>
              Marvel Chat could not load your profile.
              Please check your internet connection and Firebase configuration.
            </p>

            <button class="btn btn-primary btn-block" id="retryApp">
              Retry
            </button>

            <div style="height:8px"></div>

            <button class="btn btn-danger btn-block" id="retryLogout">
              Sign out
            </button>
          </div>
        </div>
      `;

      document.getElementById("retryApp")?.addEventListener(
        "click",
        ()=>startApplication(user)
      );

      document.getElementById("retryLogout")?.addEventListener(
        "click",
        ()=>signOut(auth)
      );
    }
  }

  onAuthStateChanged(auth,async user=>{
    state.user = user;

    if(!user){
      state.profile = null;
      state.posts = [];
      state.chats = [];
      state.activeChat = null;

      if(state.unsubscribePosts){
        state.unsubscribePosts();
        state.unsubscribePosts = null;
      }

      if(state.unsubscribeChats){
        state.unsubscribeChats();
        state.unsubscribeChats = null;
      }

      if(state.unsubscribeMessages){
        state.unsubscribeMessages();
        state.unsubscribeMessages = null;
      }

      renderAuth();
      return;
    }

    await startApplication(user);
  });

  window.addEventListener("online",()=>{
    if(state.user){
      toast("You are back online.");
      render();
    }
  });

  window.addEventListener("offline",()=>{
    if(state.user){
      toast("You are offline. Some features may be unavailable.");
      render();
    }
  });

  /*
   * Register the existing PWA service worker.
   * No Storage dependency is involved.
   */
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
      navigator.serviceWorker
        .register("./serviceworker.js",{scope:"./"})
        .then(registration=>{
          console.log(
            "Marvel Chat service worker registered:",
            registration.scope
          );
        })
        .catch(error=>{
          console.warn(
            "Service worker registration failed:",
            error
          );
        });
    });
  }

  /*
   * Initial render while Firebase Auth is resolving.
   */
  render();

</script>

</body>
</html>
