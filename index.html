<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#6D28D9">

  <meta
    name="description"
    content="Marvel Chat — Chat. Connect. Trade Your Time."
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Marvel Chat</title>

  <style>
    :root{
      --primary:#6D28D9;
      --primary-2:#8B5CF6;
      --primary-dark:#4C1D95;

      --soft:#F0E9FF;
      --bg:#F7F7FB;
      --surface:#FFFFFF;
      --surface-2:#F0EEF5;

      --text:#17131F;
      --muted:#756E80;
      --border:#E5E0EA;

      --success:#16803C;
      --danger:#C62828;
      --warning:#A16207;

      --shadow:0 10px 30px rgba(40,20,80,.08);
      --shadow-lg:0 20px 55px rgba(40,20,80,.13);

      --radius:20px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:var(--bg);
      color:var(--text);
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .hidden{
      display:none!important;
    }

    .app{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;

      height:66px;

      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);

      border-bottom:1px solid var(--border);

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand-logo{
      width:42px;
      height:42px;

      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      color:white;

      display:grid;
      place-items:center;

      font-weight:900;
      font-size:18px;

      box-shadow:
        0 8px 20px rgba(109,40,217,.25);
    }

    .brand-name{
      font-weight:900;
      font-size:17px;
      white-space:nowrap;
    }

    .brand-sub{
      color:var(--muted);
      font-size:11px;
      margin-top:1px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .icon-btn{
      width:40px;
      height:40px;

      border:1px solid var(--border);
      background:var(--surface);

      border-radius:13px;

      display:grid;
      place-items:center;

      color:var(--text);
    }

    .icon-btn:hover{
      background:var(--soft);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main{
      width:min(1100px,100%);
      margin:0 auto;

      padding:
        18px
        14px
        105px;

      flex:1;
    }

    .page{
      animation:fadeIn .18s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(4px);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero{
      background:
        linear-gradient(
          135deg,
          #6D28D9,
          #8B5CF6
        );

      color:white;

      border-radius:27px;

      padding:25px;

      box-shadow:
        0 18px 45px rgba(76,29,149,.22);

      margin-bottom:18px;
    }

    .hero h1{
      margin:0 0 7px;

      font-size:
        clamp(25px,6vw,38px);

      line-height:1.05;
    }

    .hero p{
      margin:0;

      opacity:.91;

      line-height:1.55;
    }

    /* =========================================================
       GRID / CARDS
    ========================================================= */

    .grid{
      display:grid;
      gap:14px;
    }

    .grid-2{
      grid-template-columns:
        repeat(2,minmax(0,1fr));
    }

    .grid-3{
      grid-template-columns:
        repeat(3,minmax(0,1fr));
    }

    .card{
      background:var(--surface);

      border:1px solid var(--border);

      border-radius:var(--radius);

      box-shadow:var(--shadow);

      padding:17px;
    }

    .card h2,
    .card h3{
      margin:
        0 0 8px;
    }

    .small{
      color:var(--muted);

      font-size:13px;

      line-height:1.5;
    }

    .muted{
      color:var(--muted);
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:10px;

      margin:
        22px
        0
        11px;
    }

    .section-title h2{
      margin:0;
      font-size:19px;
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn{
      border:0;

      border-radius:13px;

      padding:
        11px
        15px;

      font-weight:800;

      transition:.15s;
    }

    .btn:active{
      transform:scale(.98);
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .btn-secondary{
      background:var(--soft);
      color:var(--primary-dark);
    }

    .btn-danger{
      background:#FDECEC;
      color:var(--danger);
    }

    .btn-ghost{
      background:transparent;
      color:var(--primary);

      border:
        1px solid
        var(--border);
    }

    .btn-block{
      width:100%;
    }

    /* =========================================================
       FORMS
    ========================================================= */

    .input,
    .textarea,
    .select{
      width:100%;

      border:
        1px solid
        var(--border);

      background:#fff;

      border-radius:13px;

      padding:
        12px
        13px;

      outline:none;

      color:var(--text);
    }

    .input:focus,
    .textarea:focus,
    .select:focus{
      border-color:var(--primary-2);

      box-shadow:
        0 0 0 3px
        rgba(139,92,246,.12);
    }

    .textarea{
      resize:vertical;
      min-height:105px;
    }

    .field{
      margin-bottom:13px;
    }

    .field label{
      display:block;

      font-size:13px;

      font-weight:800;

      margin-bottom:6px;
    }

    /* =========================================================
       BOTTOM NAV
    ========================================================= */

    .bottom-nav{
      position:fixed;

      left:0;
      right:0;
      bottom:0;

      z-index:110;

      height:72px;

      background:
        rgba(255,255,255,.97);

      backdrop-filter:blur(18px);

      border-top:
        1px solid
        var(--border);

      display:flex;
      justify-content:center;
    }

    .bottom-inner{
      width:min(700px,100%);

      display:grid;

      grid-template-columns:
        repeat(5,1fr);

      align-items:center;
    }

    .nav-btn{
      border:0;

      background:transparent;

      color:var(--muted);

      height:100%;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:4px;

      font-size:11px;
      font-weight:700;
    }

    .nav-btn.active{
      color:var(--primary);
    }

    .nav-icon{
      font-size:21px;
      line-height:1;
    }

    /* =========================================================
       AUTH
    ========================================================= */

    .auth-shell{
      min-height:100vh;

      display:grid;
      place-items:center;

      padding:20px;

      background:
        radial-gradient(
          circle at top left,
          rgba(139,92,246,.20),
          transparent 40%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(109,40,217,.16),
          transparent 40%
        ),
        var(--bg);
    }

    .auth-card{
      width:min(470px,100%);

      background:#fff;

      border:
        1px solid
        var(--border);

      border-radius:29px;

      padding:25px;

      box-shadow:
        0 25px 70px
        rgba(35,20,60,.12);
    }

    .auth-logo{
      width:68px;
      height:68px;

      border-radius:22px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      color:#fff;

      display:grid;
      place-items:center;

      font-size:29px;
      font-weight:900;

      margin-bottom:16px;
    }

    .auth-card h1{
      margin:
        0 0 7px;

      font-size:29px;
    }

    .auth-card p{
      color:var(--muted);

      line-height:1.5;
    }

    /* =========================================================
       STATUS
    ========================================================= */

    .status{
      border-radius:12px;

      padding:
        11px
        13px;

      font-size:13px;

      margin:
        10px
        0;
    }

    .status.error{
      background:#FFF0F0;
      color:var(--danger);
    }

    .status.success{
      background:#ECFDF3;
      color:var(--success);
    }

    .status.info{
      background:var(--soft);
      color:var(--primary-dark);
    }

    /* =========================================================
       PROFILE
    ========================================================= */

    .profile-row{
      display:flex;

      align-items:center;

      gap:12px;
    }

    .avatar{
      width:48px;
      height:48px;

      border-radius:50%;

      background:var(--soft);

      color:var(--primary);

      display:grid;
      place-items:center;

      font-weight:900;

      flex:none;
    }

    .avatar-lg{
      width:78px;
      height:78px;

      font-size:24px;
    }

    .profile-meta{
      min-width:0;
      flex:1;
    }

    .profile-meta strong{
      display:block;

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;
    }

    /* =========================================================
       POSTS
    ========================================================= */

    .post{
      margin-bottom:14px;
    }

    .post-head{
      display:flex;

      align-items:center;

      gap:10px;

      margin-bottom:12px;
    }

    .post-body{
      line-height:1.6;

      white-space:pre-wrap;

      word-break:break-word;
    }

    .post-actions{
      display:flex;

      gap:8px;

      flex-wrap:wrap;

      margin-top:12px;

      padding-top:11px;

      border-top:
        1px solid
        var(--border);
    }

    .action{
      border:0;

      background:var(--surface-2);

      color:var(--text);

      border-radius:11px;

      padding:
        8px
        11px;

      font-size:12px;

      font-weight:700;
    }

    .action.active{
      background:var(--soft);
      color:var(--primary);
    }

    /* =========================================================
       CHAT
    ========================================================= */

    .chat-list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .chat-item{
      display:flex;

      align-items:center;

      gap:11px;

      padding:12px;

      border:
        1px solid
        var(--border);

      border-radius:15px;

      background:#fff;

      cursor:pointer;
    }

    .chat-item:hover{
      background:var(--soft);
    }

    .chat-content{
      flex:1;
      min-width:0;
    }

    .chat-content strong,
    .chat-content p{
      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;

      display:block;
    }

    .chat-content p{
      margin:4px 0 0;

      font-size:12px;

      color:var(--muted);
    }

    .message-box{
      display:flex;

      gap:8px;

      position:sticky;

      bottom:78px;

      background:var(--bg);

      padding-top:10px;
    }

    .message-box input{
      flex:1;
    }

    .messages{
      min-height:350px;

      max-height:60vh;

      overflow:auto;

      display:flex;

      flex-direction:column;

      gap:8px;

      padding:4px 0;
    }

    .bubble{
      max-width:82%;

      padding:
        10px
        12px;

      border-radius:16px;

      background:#fff;

      border:
        1px solid
        var(--border);

      align-self:flex-start;

      line-height:1.45;
    }

    .bubble.mine{
      align-self:flex-end;

      background:var(--primary);

      color:#fff;

      border-color:var(--primary);
    }

    .bubble-time{
      font-size:10px;

      opacity:.65;

      margin-top:4px;
    }

    /* =========================================================
       LISTS / STATS
    ========================================================= */

    .list{
      display:flex;

      flex-direction:column;

      gap:9px;
    }

    .list-item{
      border:
        1px solid
        var(--border);

      border-radius:14px;

      padding:13px;

      background:#fff;
    }

    .list-item strong{
      display:block;

      margin-bottom:3px;
    }

    .stat{
      padding:15px;

      border-radius:16px;

      background:var(--soft);
    }

    .stat strong{
      display:block;

      font-size:25px;

      color:var(--primary-dark);
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search{
      display:flex;

      gap:8px;

      margin-bottom:14px;
    }

    .search input{
      flex:1;
    }

    /* =========================================================
       EMPTY
    ========================================================= */

    .empty{
      text-align:center;

      padding:35px 15px;

      color:var(--muted);
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-backdrop{
      position:fixed;

      inset:0;

      background:
        rgba(15,10,25,.5);

      z-index:500;

      display:grid;

      place-items:center;

      padding:15px;
    }

    .modal{
      width:min(540px,100%);

      max-height:90vh;

      overflow:auto;

      background:#fff;

      border-radius:24px;

      padding:20px;

      box-shadow:
        0 30px 100px
        rgba(0,0,0,.25);
    }

    .modal-head{
      display:flex;

      justify-content:space-between;

      gap:10px;

      align-items:center;

      margin-bottom:15px;
    }

    .modal-head h2{
      margin:0;

      font-size:20px;
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast{
      position:fixed;

      left:50%;

      bottom:85px;

      transform:translateX(-50%);

      z-index:700;

      background:#17131F;

      color:#fff;

      border-radius:12px;

      padding:
        11px
        15px;

      font-size:13px;

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.2);

      max-width:90%;

      text-align:center;
    }

    /* =========================================================
       LOADER
    ========================================================= */

    .loader{
      width:27px;
      height:27px;

      border:
        3px solid
        #ddd;

      border-top-color:
        var(--primary);

      border-radius:50%;

      animation:
        spin .7s
        linear
        infinite;

      margin:auto;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    /* =========================================================
       STATUS DOTS
    ========================================================= */

    .online,
    .offline{
      width:9px;
      height:9px;

      border-radius:50%;

      display:inline-block;
    }

    .online{
      background:var(--success);
    }

    .offline{
      background:#999;
    }

    /* =========================================================
       BADGES
    ========================================================= */

    .badge{
      display:inline-flex;

      align-items:center;

      gap:4px;

      padding:
        4px
        8px;

      border-radius:999px;

      background:var(--soft);

      color:var(--primary-dark);

      font-size:11px;

      font-weight:800;
    }

    /* =========================================================
       COUNTRY
    ========================================================= */

    .country-grid{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:8px;
    }

    .country-option{
      border:
        1px solid
        var(--border);

      background:#fff;

      border-radius:13px;

      padding:12px;

      text-align:left;

      font-weight:700;
    }

    .country-option.selected{
      border-color:var(--primary);

      background:var(--soft);

      color:var(--primary-dark);
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media(max-width:650px){

      .grid-3{
        grid-template-columns:1fr;
      }

      .grid-2{
        grid-template-columns:1fr;
      }

      .hero{
        border-radius:21px;
      }

      .main{
        padding-left:11px;
        padding-right:11px;
      }

      .top-actions .icon-btn:nth-child(1){
        display:none;
      }
    }

    @media(min-width:700px){

      .bottom-nav{
        position:fixed;

        width:
          calc(100% - 28px);

        left:14px;
        right:14px;
        bottom:12px;

        max-width:1100px;

        margin:auto;

        border:
          1px solid
          var(--border);

        border-radius:20px;

        box-shadow:
          0 15px 40px
          rgba(20,10,40,.12);

        overflow:hidden;
      }

      .main{
        padding-bottom:105px;
      }
    }
  </style>
</head>

<body>

<div id="root">

  <div class="auth-shell">

    <div class="auth-card">

      <div class="auth-logo">M</div>

      <h1>Marvel Chat</h1>

      <p id="startupStatus">Starting Marvel Chat…</p>
<div class="loader"></div>

    </div>

  </div>

</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>


<script type="module">

  /*
   * ============================================================
   * MARVEL CHAT
   *
   * Firebase:
   *   Authentication
   *   Cloud Firestore
   *
   * NO Firebase Storage
   *
   * Collections used by this frontend:
   *
   * users
   * users/{uid}/savedPosts
   * users/{uid}/likedPosts
   * users/{uid}/notifications
   *
   * posts
   * posts/{postId}/likes
   * posts/{postId}/comments
   *
   * conversations
   * conversations/{conversationId}/messages
   *
   * skills
   * skillRequests
   * listings
   * ============================================================
   */


  /* ============================================================
     FIREBASE IMPORTS
  ============================================================ */

  import { firebaseConfig }
    from "./firebaseconfig.js";


  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    addDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    limit,
    getDocs,
    onSnapshot,
    serverTimestamp,
    increment,
    arrayUnion,
    arrayRemove
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* ============================================================
     FIREBASE INITIALIZATION
  ============================================================ */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  console.log("🔥 Firebase initialized successfully");

const startupStatus = document.getElementById("startupStatus");

if (startupStatus) {
  startupStatus.textContent = "Firebase initialized. Checking authentication…";
}


  /* ============================================================
     APPLICATION STATE
  ============================================================ */

  const state = {

    user:null,

    profile:null,

    page:"home",

    posts:[],

    conversations:[],

    activeConversation:null,

    messages:[],

    skills:[],

    listings:[],

    unsubscribePosts:null,

    unsubscribeConversations:null,

    unsubscribeMessages:null,

    unsubscribeSkills:null,

    unsubscribeListings:null,

    loading:false,

    search:"",

    lowData:
      localStorage.getItem("marvel_low_data") === "1",

    theme:
      localStorage.getItem("marvel_theme") || "light"

  };


  /* ============================================================
     DOM
  ============================================================ */

  const root =
    document.getElementById("root");

  const modalRoot =
    document.getElementById("modalRoot");

  const toastRoot =
    document.getElementById("toastRoot");


  /* ============================================================
     COUNTRIES
  ============================================================ */

  const countries = [

    ["NG","🇳🇬 Nigeria"],

    ["GH","🇬🇭 Ghana"],

    ["KE","🇰🇪 Kenya"],

    ["ZA","🇿🇦 South Africa"],

    ["US","🇺🇸 United States"],

    ["GB","🇬🇧 United Kingdom"],

    ["CA","🇨🇦 Canada"],

    ["IN","🇮🇳 India"],

    ["OTHER","🌍 Other"]

  ];


  /* ============================================================
     HELPERS
  ============================================================ */

  function escapeHtml(value){

    return String(value ?? "")

      .replaceAll("&","&amp;")

      .replaceAll("<","&lt;")

      .replaceAll(">","&gt;")

      .replaceAll('"',"&quot;")

      .replaceAll("'","&#039;");

  }


  function initials(name){

    const text =
      String(name || "User").trim();

    return text

      .split(/\s+/)

      .slice(0,2)

      .map(
        x =>
          x[0]?.toUpperCase() || ""
      )

      .join("") || "U";

  }


  function formatDate(value){

    if(!value){
      return "";
    }

    const date =
      value?.toDate
        ? value.toDate()
        : new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return "";
    }

    return date.toLocaleString(
      [],
      {
        day:"numeric",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }


  function toast(message){

    toastRoot.innerHTML = `

      <div class="toast">

  /* ============================================================
     FIREBASE ERROR HANDLING
  ============================================================ */

  function friendlyFirebaseError(error){

    const code =
      error?.code || "";


    const messages = {

      "auth/email-already-in-use":
        "This email is already registered.",

      "auth/invalid-email":
        "Please enter a valid email address.",

      "auth/weak-password":
        "Password must be at least 6 characters.",

      "auth/invalid-credential":
        "Incorrect email or password.",

      "auth/user-not-found":
        "No account was found with this email.",

      "auth/wrong-password":
        "Incorrect password.",

      "auth/network-request-failed":
        "Network connection failed. Check your internet.",

      "auth/too-many-requests":
        "Too many attempts. Please wait and try again.",

      "permission-denied":
        "Firestore permission denied. Check your Firestore Rules."

    };


    return (
      messages[code] ||
      error?.message ||
      "Something went wrong."
    );

  }

  function renderAuth(

    root.innerHTML = `

          <div class="field">

            </label>

            <input

              placeholder="you@example.com"

          <div class="field">

          </div>


          ${
            mode === "register"
              ? `

                <div class="field">

                  <label>
                    Username
                  </label>

                  <input
                    id="authUsername"
                    class="input"
                    type="text"
                    maxlength="40"

                </div>


                <div class="field">

                  </label>

                  >

                </div>

              `
              : ""
          }


          <button
            class="btn btn-primary btn-block"
            id="authSubmit"
          >

            ${
              mode === "login"
                ? "Sign in"
                : "Create account"
            }

          </button>


          <div style="height:10px"></div>


          <button
            class="btn btn-ghost btn-block"
            id="authSwitch"
          >

            ${
              mode === "login"
                ? "Create a new account"
                : "I already have an account"
            }

          </button>


          <p
            class="small"

          >
            Marvel Chat uses Firebase Authentication
            to protect your account.
          </p>

        </div>

      </div>

    `;


    document
      .getElementById("authSubmit")
      ?.addEventListener(
        "click",
        async () => {

          const email =
            document
              .getElementById("authEmail")
              ?.value
              .trim();

          const password =
            document
              .getElementById("authPassword")
              ?.value;


          if(!email || !password){

            renderAuth(
              mode,
              "Please enter your email and password."
            );

            return;
          }


          try{

            if(mode === "login"){

              await signInWithEmailAndPassword(
                auth,
                email,
                password
              );

            }else{

              const username =
                document
                  .getElementById("authUsername")
                  ?.value
                  .trim();

              const phone =
                document
                  .getElementById("authPhone")
                  ?.value
                  .trim();


              if(!username){

              if(!phone){

                  mode,

                renderAuth(

              const credential =
                await createUserWithEmailAndPassword(

                }

              /*

               * the Firestore rules expect it.

                  username,

                  displayName:

                  merge:true

              error

            renderAuth(
              mode,
              friendlyFirebaseError(error)
            );

          }

        }
      );


    document
      .getElementById("authSwitch")
      ?.addEventListener(
        "click",
        () => {

          renderAuth(
            mode === "login"
              ? "register"
              : "login"
          );

        }
      );

  /* ============================================================
     LOAD PROFILE
  ============================================================ */

  async function loadProfile(user){

    const ref =
      doc(
        db,
        "users",
        user.uid
      );


    const snap =
      await getDoc(ref);


    if(snap.exists()){

      state.profile = {

        uid:user.uid,

        ...snap.data()

      };

    }else{

      /*
       * This also makes sure a profile exists
       * for an authenticated Firebase user.
       */

      state.profile = {

        uid:user.uid,

        username:
          user.displayName ||
          "User",

        displayName:
          user.displayName ||
          "User",

        email:
          user.email ||
          "",

        phone:"",

        country:null,

        onboardingComplete:false,

        timeBalance:0

      };


      await setDoc(
        ref,
        {

          ...state.profile,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        },
        {
          merge:true
        }
      );

    }

  }

    let content = "";

          renderHomePage();

        break;

    }


    layout(content);

  /* ============================================================

  async function toggleLike(postId){

    try{

      const post =
        state.posts.find(
          x =>
            x.id === postId
        );


      if(!post){
        return;
      }


      const liked =
        Array.isArray(
          post.likedBy
        ) &&
        post.likedBy.includes(
          state.user.uid
        );


      if(liked){

        await updateDoc(
          doc(
            db,
            "posts",
            postId
          ),
          {

            likedBy:
              arrayRemove(
                state.user.uid
              ),

            likesCount:
              increment(-1)

          }
        );

      }else{

        await updateDoc(
          doc(
            db,
            "posts",
            postId
          ),
          {

            likedBy:
              arrayUnion(
                state.user.uid
              ),

            likesCount:
              increment(1)

          }
        );

      }

    }catch(error){

      console.error(error);

      toast(
        "Could not update like."
      );

    }

  }

          title:

  /* ============================================================
     CREATE / OPEN CONVERSATION
  ============================================================ */

  async function createOrOpenConversation(
    other
  ){

    const participants = [

      state.user.uid,

      other.uid

    ].sort();


    try{

      const q =
        query(

          collection(
            db,
            "conversations"
          ),

          where(
            "participants",
            "==",
            participants
          ),

          limit(1)

        );


      const snap =
        await getDocs(q);


      if(!snap.empty){

        closeModal();

        await openConversation(
          snap.docs[0].id
        );

        return;

      }


      const participantProfiles = {

        [state.user.uid]:{

          username:
            state.profile.username ||
            "User",

          displayName:
            state.profile.displayName ||
            state.profile.username ||
            "User"

        },


        [other.uid]:{

          username:
            other.username ||
            "User",

          displayName:
            other.displayName ||
            other.username ||
            "User"

        }

      };


      const ref =
        await addDoc(

          collection(
            db,
            "conversations"
          ),

          {

            /*
             * EXACTLY matches
             * your conversation rules.
             */

            participants,

            participantProfiles,

            lastMessage:"",

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }

        );


      closeModal();

      await openConversation(
        ref.id
      );

    }catch(error){

      console.error(error);

      toast(
        friendlyFirebaseError(error)
      );

    }

  }


  /* ============================================================
     OPEN CONVERSATION
  ============================================================ */

  async function openConversation(
    conversationId
  ){

    state.activeConversation =
      conversationId;

    state.messages = [];


    if(
      state.unsubscribeMessages
    ){

      state.unsubscribeMessages();

      state.unsubscribeMessages =
        null;

    }


    render();


    const messagesQuery =
      query(

        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),

        orderBy(
          "createdAt",
          "asc"
        ),

        limit(200)

      );


    state.unsubscribeMessages =
      onSnapshot(

        messagesQuery,

        snap => {

          state.messages =
            snap.docs.map(
              d => ({

                id:d.id,

                ...d.data()

              })
            );


          renderConversationOnly();

        },

        error => {

          console.error(
            "Messages:",
            error
          );

          toast(
            friendlyFirebaseError(
              error
            )
          );

        }

      );

  }

  /* ============================================================
     EDIT PROFILE
  ============================================================ */

  function showEditProfile(){

    showModal(
      "Edit profile",
      `

        <div class="field">

          <label>
            Display name
          </label>

          <input
            id="editName"
            class="input"
            maxlength="60"
            value="${escapeHtml(
              state.profile.displayName ||
              state.profile.username ||
              ""
            )}"
          >

        </div>


        <div class="field">

          <label>
            Phone
          </label>

          <input
            id="editPhone"
            class="input"
            value="${escapeHtml(
              state.profile.phone ||
              ""
            )}"
          >

        </div>


        <button
          class="btn btn-primary btn-block"
          id="saveProfile"
        >
          Save changes
        </button>

      `
    );


    document
      .getElementById(
        "saveProfile"
      )
      ?.addEventListener(
        "click",
        async () => {

          const displayName =
            document
              .getElementById(
                "editName"
              )
              ?.value
              .trim();


          const phone =
            document
              .getElementById(
                "editPhone"
              )
              ?.value
              .trim();


          if(!displayName){

            toast(
              "Display name cannot be empty."
            );

            return;

          }


          try{

            await updateProfile(
              auth.currentUser,
              {
                displayName
              }
            );


            await updateDoc(

              doc(
                db,
                "users",
                state.user.uid
              ),

              {

                displayName,

                phone,

                updatedAt:
                  serverTimestamp()

              }

            );


            state.profile.displayName =
              displayName;

            state.profile.phone =
              phone;


            closeModal();

            render();

            toast(
              "Profile updated."
            );

          }catch(error){

            console.error(error);

            toast(
              friendlyFirebaseError(
                error
              )
            );

          }

        }
      );

  }


  /* ============================================================
     SETTINGS
  ============================================================ */

          <div class="list-item">

            <strong>

  /* ============================================================
     GLOBAL SEARCH
  ============================================================ */

  function showSearch(){

    showModal(
      "Search Marvel Chat",
      `

        <div class="field">

          <input
            id="globalSearch"
            class="input"
            placeholder="Search posts..."
          >

        </div>


        <button
          class="btn btn-primary btn-block"
          id="runSearch"
        >
          Search
        </button>


        <div
          id="searchResults"
          style="margin-top:15px"
        ></div>

      `
    );


    document
      .getElementById(
        "runSearch"
      )
      ?.addEventListener(
        "click",
        () => {

          const term =
            document
              .getElementById(
                "globalSearch"
              )
              ?.value
              .trim()
              .toLowerCase();


          if(!term){
            return;
          }


          const results =
            state.posts.filter(
              post =>

                String(
                  post.text || ""
                )
                  .toLowerCase()
                  .includes(term)

                ||

                String(
                  post.username || ""
                )
                  .toLowerCase()
                  .includes(term)

            );


          document
            .getElementById(
              "searchResults"
            )
            .innerHTML =

            results.length

              ? results
                  .map(
                    post => `

                      <div class="list-item">

                        <strong>
                          ${escapeHtml(
                            post.username ||
                            "User"
                          )}
                        </strong>

                        <div>
                          ${escapeHtml(
                            post.text ||
                            ""
                          )}
                        </div>

                      </div>

                    `
                  )
                  .join("")

              : `

                  <div class="empty">
                    No matching posts found.
                  </div>

                `;

        }
      );

  }


  /* ============================================================
     NOTIFICATIONS
  ============================================================ */

  async function showNotifications(){

    showModal(
      "Notifications",
      `

        <div
          id="notificationContent"
          class="empty"
        >
          Loading notifications…
        </div>

      `
    );


    try{

      const q =
        query(

          collection(
            db,
            "users",
            state.user.uid,
            "notifications"
          ),

          orderBy(
            "createdAt",
            "desc"
          ),

          limit(30)

        );


      const snap =
        await getDocs(q);


      const notifications =
        snap.docs.map(
          d => ({
            id:d.id,
            ...d.data()
          })
        );


      const content =
        document.getElementById(
          "notificationContent"
        );


      if(!content){
        return;
      }


      content.className =
        notifications.length
          ? "list"
          : "empty";


      content.innerHTML =
        notifications.length

          ? notifications
              .map(
                notification => `

                  <div class="list-item">

                    <strong>
                      ${escapeHtml(
                        notification.title ||
                        "Notification"
                      )}
                    </strong>

                    <div>
                      ${escapeHtml(
                        notification.message ||
                        ""
                      )}
                    </div>

                    <div class="small">

                      ${escapeHtml(
                        formatDate(
                          notification.createdAt
                        )
                      )}

                    </div>

                  </div>

                `
              )
              .join("")

          : `

              <div style="font-size:30px">
                🔔
              </div>

              <p>
                No new notifications.
              </p>

            `;

    }catch(error){

      console.error(error);

      const content =
        document.getElementById(
          "notificationContent"
        );


      if(content){

        content.innerHTML = `

          <div class="status error">

            Could not load notifications.

          </div>

        `;

      }

    }

  }


  /* ============================================================
     PAGE EVENTS
  ============================================================ */

  function attachPageEvents(){

    /* HOME */

    if(
      state.page === "home"
    ){

      document
        .getElementById(
          "createPostBtn"
        )
        ?.addEventListener(
          "click",
          showCreatePost
        );


      document
        .getElementById(
          "emptyCreatePost"
        )
        ?.addEventListener(
          "click",
          showCreatePost
        );


      document
        .querySelectorAll(
          "[data-like]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              toggleLike(
                button.dataset.like
              )
          );

        });


      document
        .querySelectorAll(
          "[data-comment]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              showComments(
                button.dataset.comment
              )
          );

        });


      document
        .querySelectorAll(
          "[data-share]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              sharePost(
                button.dataset.share
              )
          );

        });


      document
        .querySelectorAll(
          "[data-save]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              savePost(
                button.dataset.save
              )
          );

        });

    }


    /* CHAT */

    if(
      state.page === "chat"
    ){

      if(
        state.activeConversation
      ){

        document
          .getElementById(
            "backChats"
          )
          ?.addEventListener(
            "click",
            () => {

              if(
                state.unsubscribeMessages
              ){

                state.unsubscribeMessages();

                state.unsubscribeMessages =
                  null;

              }


              state.activeConversation =
                null;

              state.messages = [];

              render();

            }
          );


        document
          .getElementById(
            "sendMessage"
          )
          ?.addEventListener(
            "click",
            sendMessage
          );


        document
          .getElementById(
            "messageInput"
          )
          ?.addEventListener(
            "keydown",
            event => {

              if(
                event.key ===
                "Enter"
              ){

                event.preventDefault();

                sendMessage();

              }

            }
          );

      }else{

        document
          .getElementById(
            "newChatBtn"
          )
          ?.addEventListener(
            "click",
            showNewChat
          );


        document
          .getElementById(
            "newChatEmpty"
          )
          ?.addEventListener(
            "click",
            showNewChat
          );


        document
          .querySelectorAll(
            "[data-conversation]"
          )
          .forEach(item => {

            item.addEventListener(
              "click",
              () =>
                openConversation(
                  item.dataset
                    .conversation
                )
            );

          });


        document
          .getElementById(
            "chatSearch"
          )
          ?.addEventListener(
            "input",
            event => {

              state.search =
                event.target.value
                  .toLowerCase();

              renderChatSearch();

            }
          );

      }

    }


    /* TIMETRUST */

    if(
      state.page ===
      "timetrust"
    ){

      document
        .getElementById(
          "offerSkillBtn"
        )
        ?.addEventListener(
          "click",
          () =>
            showSkillModal(
              "offer"
            )
        );


      document
        .getElementById(
          "requestSkillBtn"
        )
        ?.addEventListener(
          "click",
          () =>
            showSkillModal(
              "request"
            )
        );

    }


    /* MARKET */

    if(
      state.page ===
      "market"
    ){

      document
        .getElementById(
          "sellBtn"
        )
        ?.addEventListener(
          "click",
          showSellModal
        );


      document
        .getElementById(
          "marketSearch"
        )
        ?.addEventListener(
          "input",
          event => {

            state.search =
              event.target.value;

            const marketItems =
              document.getElementById(
                "marketItems"
              );


            if(marketItems){

              marketItems.innerHTML =
                renderListings();

            }

          }
        );

    }


    /* PROFILE */

    if(
      state.page ===
      "profile"
    ){

      document
        .getElementById(
          "editProfileBtn"
        )
        ?.addEventListener(
          "click",
          showEditProfile
        );


      document
        .getElementById(
          "settingsBtn"
        )
        ?.addEventListener(
          "click",
          showSettings
        );


      document
        .getElementById(
          "logoutBtn"
        )
        ?.addEventListener(
          "click",
          () =>
            signOut(auth)
        );

    }

  }


  function renderChatSearch(){

    const list =
      document.getElementById(
        "chatList"
      );


    if(!list){
      return;
    }


    const filtered =
      state.conversations.filter(
        conversation => {

          const profiles =
            Object.values(
              conversation
                .participantProfiles ||
              {}
            );


          const names =
            profiles
              .map(
                profile =>
                  `${profile.displayName || ""}
                   ${profile.username || ""}`
              )
              .join(" ");


          return names
            .toLowerCase()
            .includes(
              state.search
            );

        }
      );


    list.innerHTML =
      filtered.length

        ? filtered
            .map(
              conversation => {

                const otherUid =
                  conversation
                    .participants
                    ?.find(
                      uid =>
                        uid !==
                        state.user.uid
                    ) || "";


                const profile =
                  conversation
                    .participantProfiles
                    ?.[otherUid] ||
                  {};


                const otherName =
                  profile.displayName ||
                  profile.username ||
                  "User";


                return `

                  <div
                    class="chat-item"
                    data-conversation="${conversation.id}"
                  >

                    <div class="avatar">

                      ${escapeHtml(
                        initials(
                          otherName
                        )
                      )}

                    </div>


                    <div class="chat-content">

                      <strong>
                        ${escapeHtml(
                          otherName
                        )}
                      </strong>

                      <p>
                        ${
                          conversation.lastMessage
                            ? escapeHtml(
                                conversation.lastMessage
                              )
                            : "Start chatting"
                        }
                      </p>

                    </div>

                  </div>

                `;

              }
            )
            .join("")

        : `

            <div class="empty">
              No matching conversations.
            </div>

          `;


    list
      .querySelectorAll(
        "[data-conversation]"
      )
      .forEach(item => {

        item.addEventListener(
          "click",
          () =>
            openConversation(
              item.dataset
                .conversation
            )
        );

      });

  }


  /* ============================================================
     FIRESTORE LISTENERS
  ============================================================ */

  function subscribePosts(){

    if(
      state.unsubscribePosts
    ){

      state.unsubscribePosts();

      state.unsubscribePosts =
        null;

    }


    const postsQuery =
      query(

        collection(
          db,
          "posts"
        ),

        orderBy(
          "createdAt",
          "desc"
        ),

        limit(50)

      );


    state.unsubscribePosts =
      onSnapshot(

        postsQuery,

        snap => {

          state.posts =
            snap.docs.map(
              d => ({

                id:d.id,

                ...d.data()

              })
            );


          if(
            state.user &&
            state.profile
              ?.onboardingComplete
          ){

            if(
              state.page === "home"
            ){

              render();

            }

          }

        },

        error => {

          console.error(
            "Posts listener:",
            error
          );

        }

      );

  }


  function subscribeConversations(){

    if(
      state.unsubscribeConversations
    ){

      state.unsubscribeConversations();

      state.unsubscribeConversations =
        null;

    }


    if(!state.user){
      return;
    }


    const conversationsQuery =
      query(

        collection(
          db,
          "conversations"
        ),

        where(
          "participants",
          "array-contains",
          state.user.uid
        ),

        orderBy(
          "updatedAt",
          "desc"
        ),

        limit(50)

      );


    state.unsubscribeConversations =
      onSnapshot(

        conversationsQuery,

        snap => {

          state.conversations =
            snap.docs.map(
              d => ({

                id:d.id,

                ...d.data()

              })
            );


          if(
            state.page === "chat" &&
            !state.activeConversation
          ){

            render();

          }

        },

        error => {

          console.error(
            "Conversation listener:",
            error
          );

        }

      );

  }


  function subscribeListings(){

    if(
      state.unsubscribeListings
    ){

      state.unsubscribeListings();

      state.unsubscribeListings =
        null;

    }


    const listingsQuery =
      query(

        collection(
          db,
          "listings"
        ),

        where(
          "status",
          "==",
          "active"
        ),

        orderBy(
          "createdAt",
          "desc"
        ),

        limit(50)

      );


    state.unsubscribeListings =
      onSnapshot(

        listingsQuery,

        snap => {

          state.listings =
            snap.docs.map(
              d => ({

                id:d.id,

                ...d.data()

              })
            );


          if(
            state.page ===
            "market"
          ){

            render();

          }

        },

        error => {

          console.error(
            "Listings listener:",
            error
          );

        }

      );

  }


  /* ============================================================
     START APPLICATION
  ============================================================ */

  async function startApplication(
    user
  ){

    state.user =
      user;


    try{

      await loadProfile(
        user
      );


      subscribePosts();

      subscribeConversations();

      subscribeListings();


      render();

    }catch(error){

      console.error(
        "Application startup:",
        error
      );


      root.innerHTML = `

        <div class="auth-shell">

          <div class="auth-card">

            <div class="auth-logo">
              !
            </div>


            <h1>
              Connection problem
            </h1>


            <p>
              Marvel Chat could not load
              your profile. Please check
              your internet connection and
              Firebase configuration.
            </p>


            <div class="status error">

              ${escapeHtml(
                friendlyFirebaseError(
                  error
                )
              )}

            </div>


            <button
              class="btn btn-primary btn-block"
              id="retryApp"
            >
              Retry
            </button>


            <div style="height:8px"></div>


            <button
              class="btn btn-danger btn-block"
              id="retryLogout"
            >
              Sign out
            </button>

          </div>

        </div>

      `;


      document
        .getElementById(
          "retryApp"
        )
        ?.addEventListener(
          "click",
          () =>
            startApplication(
              user
            )
        );


      document
        .getElementById(
          "retryLogout"
        )
        ?.addEventListener(
          "click",
          () =>
            signOut(auth)
        );

    }

  }


  /* ============================================================
     AUTH STATE
  ============================================================ */

  onAuthStateChanged(
    auth,
    async user => {
      console.log("🔥 Auth state resolved:", user ? user.uid : "No user");

      state.user =
        user;


      if(!user){

        state.profile =
          null;

        state.posts =
          [];

        state.conversations =
          [];

        state.listings =
          [];

        state.activeConversation =
          null;


        if(
          state.unsubscribePosts
        ){

          state.unsubscribePosts();

          state.unsubscribePosts =
            null;

        }


        if(
          state.unsubscribeConversations
        ){

          state.unsubscribeConversations();

          state.unsubscribeConversations =
            null;

        }


        if(
          state.unsubscribeListings
        ){

          state.unsubscribeListings();

          state.unsubscribeListings =
            null;

        }


        if(
          state.unsubscribeMessages
        ){

          state.unsubscribeMessages();

          state.unsubscribeMessages =
            null;

        }


        renderAuth();

        return;

      }


      await startApplication(
        user
      );

    }
  );


  /* ============================================================
     NETWORK STATUS
  ============================================================ */

  window.addEventListener(
    "online",
    () => {

      if(state.user){

        toast(
          "You are back online."
        );

        render();

      }

    }
  );


  window.addEventListener(
    "offline",
    () => {

      if(state.user){

        toast(
          "You are offline. Some features may be unavailable."
        );

        render();

      }

    }
  );


  /* ============================================================
     SERVICE WORKER
  ============================================================ */

  if(
    "serviceWorker" in navigator
  ){

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker

          .register(
            "./serviceworker.js",
            {
              scope:"./"
            }
          )

          .then(
            registration => {

              console.log(
                "Marvel Chat service worker registered:",
                registration.scope
              );

            }
          )

          .catch(
            error => {

              console.warn(
                "Service worker registration failed:",
                error
              );

            }
          );

      }
    );

  }


  /* ============================================================
     INITIAL RENDER
  ============================================================ */

  render();

</script>
