<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6D28D9">
<meta name="description" content="Marvel Chat — Connect. Chat. Trade your time. Discover opportunities.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Marvel Chat</title>

<style>
:root{
  --primary:#6d28d9;
  --primary2:#8b5cf6;
  --primary3:#a78bfa;
  --deep:#4c1d95;
  --bg:#f7f7fb;
  --surface:#fff;
  --surface2:#f0eef5;
  --surface3:#faf9fd;
  --text:#17131f;
  --muted:#756e80;
  --border:#e5e0ea;
  --success:#16803c;
  --danger:#c62828;
  --warning:#a16207;
  --info:#2563eb;
  --shadow:0 10px 30px rgba(40,20,80,.08);
  --shadow2:0 22px 65px rgba(40,20,80,.15);
  --radius:20px;
  --top:68px;
  --nav:76px;
}

html[data-theme="dark"]{
  --bg:#0d0b12;
  --surface:#17141e;
  --surface2:#24202d;
  --surface3:#1d1926;
  --text:#f8f5fc;
  --muted:#b4acbf;
  --border:#342d3e;
  --shadow:0 10px 30px rgba(0,0,0,.25);
  --shadow2:0 25px 75px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:var(--top);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-logo,
.auth-logo{
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  font-weight:950;
  box-shadow:0 10px 28px rgba(109,40,217,.3);
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:14px;
}

.brand-name{
  font-weight:950;
  font-size:17px;
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:1px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:13px;
  display:grid;
  place-items:center;
}

.icon-btn:hover{
  background:var(--surface2);
}

.main{
  width:min(1120px,100%);
  margin:auto;
  padding:18px 14px calc(var(--nav) + 35px);
  flex:1;
}

.page{
  animation:in .2s ease;
}

@keyframes in{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#4c1d95,#6d28d9 50%,#8b5cf6);
  color:#fff;
  border-radius:28px;
  padding:24px;
  margin-bottom:16px;
  box-shadow:0 20px 55px rgba(76,29,149,.25);
}

.hero:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  right:-55px;
  top:-80px;
  box-shadow:
    0 0 0 30px rgba(255,255,255,.04),
    0 0 0 60px rgba(255,255,255,.03);
}

.hero h1{
  margin:0 0 7px;
  font-size:clamp(25px,6vw,40px);
  line-height:1.05;
  position:relative;
  z-index:1;
}

.hero p{
  margin:0;
  opacity:.92;
  line-height:1.55;
  position:relative;
  z-index:1;
}

.grid{
  display:grid;
  gap:14px;
}

.grid2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:17px;
}

.card h2,
.card h3{
  margin:0 0 8px;
}

.small{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.muted{
  color:var(--muted);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:22px 0 11px;
}

.section-title h2{
  margin:0;
  font-size:19px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:11px 15px;
  font-weight:850;
  transition:.15s;
}

.btn:active{
  transform:scale(.98);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--deep);
}

.btn-secondary{
  background:color-mix(in srgb,var(--primary) 11%,var(--surface));
  color:var(--deep);
}

html[data-theme=dark] .btn-secondary{
  color:#d9c8ff;
}

.btn-ghost{
  background:transparent;
  color:var(--primary);
  border:1px solid var(--border);
}

.btn-danger{
  background:#fdecec;
  color:var(--danger);
}

.btn-block{
  width:100%;
}

.input,
.textarea,
.select{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:13px;
  padding:12px 13px;
  outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:var(--primary2);
  box-shadow:0 0 0 3px rgba(139,92,246,.13);
}

.textarea{
  resize:vertical;
  min-height:105px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:850;
  margin-bottom:6px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:110;
  height:var(--nav);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:center;
}

.bottom-inner{
  width:min(700px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  font-weight:800;
}

.nav-btn.active{
  color:var(--primary);
}

.nav-icon{
  font-size:21px;
  line-height:1;
}

.auth-shell{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,rgba(139,92,246,.2),transparent 40%),
    radial-gradient(circle at bottom right,rgba(109,40,217,.16),transparent 40%),
    var(--bg);
}

.auth-card{
  width:min(480px,100%);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:30px;
  padding:26px;
  box-shadow:var(--shadow2);
}

.auth-logo{
  width:70px;
  height:70px;
  border-radius:23px;
  font-size:30px;
  margin-bottom:16px;
}

.auth-card h1{
  margin:0 0 7px;
  font-size:29px;
}

.auth-card p{
  color:var(--muted);
  line-height:1.5;
}

.status{
  border-radius:12px;
  padding:11px 13px;
  font-size:13px;
  margin:10px 0;
}

.status.error{
  background:#fff0f0;
  color:var(--danger);
}

.status.success{
  background:#ecfdf3;
  color:var(--success);
}

.status.info{
  background:color-mix(in srgb,var(--primary) 10%,var(--surface));
  color:var(--deep);
}

.profile-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:color-mix(in srgb,var(--primary) 12%,var(--surface));
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:950;
  flex:none;
}

.avatar-lg{
  width:80px;
  height:80px;
  font-size:25px;
}

.profile-meta{
  min-width:0;
  flex:1;
}

.profile-meta strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.post{
  margin-bottom:14px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.post-body{
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid var(--border);
}

.action{
  border:0;
  background:var(--surface2);
  color:var(--text);
  border-radius:11px;
  padding:8px 11px;
  font-size:12px;
  font-weight:750;
}

.action.active{
  background:color-mix(in srgb,var(--primary) 14%,var(--surface));
  color:var(--primary);
}

.stat{
  padding:15px;
  border-radius:17px;
  background:color-mix(in srgb,var(--primary) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--primary) 12%,var(--border));
}

.stat strong{
  display:block;
  font-size:25px;
  color:var(--primary);
}

.chat-list,
.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--surface);
  cursor:pointer;
}

.chat-item:hover{
  background:var(--surface2);
}

.chat-content{
  flex:1;
  min-width:0;
}

.chat-content strong,
.chat-content p{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:block;
}

.chat-content p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--muted);
}

.messages{
  min-height:350px;
  max-height:60vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:4px 0;
}

.bubble{
  max-width:82%;
  padding:10px 12px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--border);
  align-self:flex-start;
  line-height:1.45;
}

.bubble.mine{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.bubble-time{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
}

.message-box{
  display:flex;
  gap:8px;
  position:sticky;
  bottom:var(--nav);
  background:var(--surface);
  padding-top:10px;
}

.list-item{
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  background:var(--surface);
}

.list-item strong{
  display:block;
  margin-bottom:3px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border-radius:999px;
  background:color-mix(in srgb,var(--primary) 11%,var(--surface));
  color:var(--deep);
  font-size:11px;
  font-weight:850;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search input{
  flex:1;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick{
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:17px;
  padding:14px;
  text-align:left;
  box-shadow:var(--shadow);
  transition:.15s;
}

.quick:hover{
  transform:translateY(-2px);
  border-color:var(--primary3);
}

.quick-icon{
  font-size:24px;
  margin-bottom:7px;
}

.quick strong{
  display:block;
  font-size:13px;
}

.quick span{
  font-size:11px;
  color:var(--muted);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,10,25,.58);
  z-index:500;
  display:grid;
  place-items:center;
  padding:15px;
}

.modal{
  width:min(570px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  color:var(--text);
  border-radius:25px;
  padding:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.3);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  z-index:700;
  background:#17131f;
  color:#fff;
  border-radius:13px;
  padding:11px 15px;
  font-size:13px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  max-width:90%;
  text-align:center;
}

.loader{
  width:28px;
  height:28px;
  border:3px solid #ddd;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:20px auto;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.online,
.offline{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
}

.online{
  background:var(--success);
}

.offline{
  background:#999;
}

.country-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.country-option{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:13px;
  padding:12px;
  text-align:left;
  font-weight:750;
}

.country-option.selected{
  border-color:var(--primary);
  background:color-mix(in srgb,var(--primary) 11%,var(--surface));
  color:var(--deep);
}

.feature-line{
  display:flex;
  gap:11px;
  align-items:flex-start;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}

.feature-line:last-child{
  border-bottom:0;
}

.feature-icon{
  width:34px;
  height:34px;
  border-radius:11px;
  background:color-mix(in srgb,var(--primary) 12%,var(--surface));
  display:grid;
  place-items:center;
  flex:none;
}

.segmented{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:12px;
}

.segmented button{
  white-space:nowrap;
}

.notice{
  padding:12px 14px;
  border-radius:14px;
  background:color-mix(in srgb,var(--info) 9%,var(--surface));
  color:var(--text);
  border:1px solid color-mix(in srgb,var(--info) 14%,var(--border));
}

@media(max-width:700px){
  .grid3,
  .grid4,
  .grid2{
    grid-template-columns:1fr;
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero{
    border-radius:22px;
  }

  .main{
    padding-left:11px;
    padding-right:11px;
  }

  .top-actions .icon-btn:nth-child(1){
    display:none;
  }
}

@media(min-width:701px){
  .bottom-nav{
    left:14px;
    right:14px;
    bottom:12px;
    width:calc(100% - 28px);
    max-width:1100px;
    margin:auto;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 15px 40px rgba(20,10,40,.12);
    overflow:hidden;
  }

  .main{
    padding-bottom:115px;
  }
}
</style>
</head>

<body>

<div id="root">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo">M</div>
      <h1>Marvel Chat</h1>
      <p id="startupStatus">Starting the future…</p>
      <div class="loader"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">

import { firebaseConfig } from "./firebaseConfig.js";

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  addDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  limit,
  getDocs,
  onSnapshot,
  serverTimestamp,
  increment,
  arrayUnion,
  arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const root = document.getElementById("root");
const modalRoot = document.getElementById("modalRoot");
const toastRoot = document.getElementById("toastRoot");

const state = {
  user:null,
  profile:null,
  page:"home",
  posts:[],
  conversations:[],
  activeConversation:null,
  messages:[],
  skills:[],
  requests:[],
  listings:[],
  notifications:[],
  search:"",
  marketCategory:"all",
  timeTab:"offers",
  lowData:localStorage.getItem("marvel_low_data")==="1",
  theme:localStorage.getItem("marvel_theme")||"light",
  installPrompt:null,

  unsubs:{
    posts:null,
    conversations:null,
    messages:null,
    skills:null,
    requests:null,
    listings:null
  }
};


const countries = [
  ["NG","🇳🇬 Nigeria"],
  ["GH","🇬🇭 Ghana"],
  ["KE","🇰🇪 Kenya"],
  ["ZA","🇿🇦 South Africa"],
  ["US","🇺🇸 United States"],
  ["GB","🇬🇧 United Kingdom"],
  ["CA","🇨🇦 Canada"],
  ["IN","🇮🇳 India"],
  ["OTHER","🌍 Other"]
];

const categories = [
  "all",
  "Electronics",
  "Fashion",
  "Books",
  "Services",
  "Food",
  "Other"
];


function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function initials(n){
  return String(n || "User")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0]?.toUpperCase() || "")
    .join("") || "U";
}


function formatDate(v){
  if(!v) return "";

  const d = v?.toDate
    ? v.toDate()
    : new Date(v);

  return Number.isNaN(d.getTime())
    ? ""
    : d.toLocaleString([],{
        day:"numeric",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      });
}


function toast(m){
  toastRoot.innerHTML =
    `<div class="toast">${escapeHtml(m)}</div>`;

  setTimeout(()=>{
    toastRoot.innerHTML="";
  },2800);
}


function showModal(title,body){
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <div class="modal-head">
          <h2>${escapeHtml(title)}</h2>
          <button class="icon-btn" id="closeModal">✕</button>
        </div>
        ${body}
      </div>
    </div>
  `;

  document
    .getElementById("closeModal")
    ?.addEventListener("click",closeModal);

  document
    .getElementById("modalBackdrop")
    ?.addEventListener("click",e=>{
      if(e.target.id==="modalBackdrop"){
        closeModal();
      }
    });
}


function closeModal(){
  modalRoot.innerHTML="";
}


function applyTheme(){
  document.documentElement.dataset.theme=state.theme;
}


function friendly(e){

  const c=e?.code || "";

  const m={
    "auth/email-already-in-use":
      "This email is already registered.",

    "auth/invalid-email":
      "Please enter a valid email address.",

    "auth/weak-password":
      "Password must be at least 6 characters.",

    "auth/invalid-credential":
      "Incorrect email or password.",

    "auth/user-not-found":
      "No account was found with this email.",

    "auth/wrong-password":
      "Incorrect password.",

    "auth/network-request-failed":
      "Network connection failed. Check your internet.",

    "auth/too-many-requests":
      "Too many attempts. Please wait and try again.",

    "permission-denied":
      "Firestore permission denied. Check your Firestore Rules.",

    "failed-precondition":
      "Firestore needs an index for this query. Check the Firebase console."
  };

  return m[c] ||
    e?.message ||
    "Something went wrong. Please try again.";
}


async function loadProfile(user){

  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);

  if(snap.exists()){
    state.profile={
      uid:user.uid,
      ...snap.data()
    };
    return;
  }

  const profile={
    uid:user.uid,
    displayName:user.displayName || "User",
    username:"",
    email:user.email || "",
    country:"",
    bio:"",
    createdAt:serverTimestamp()
  };

  await setDoc(ref,profile);

  state.profile={
    uid:user.uid,
    ...profile
  };
}


function renderAuth(){

  applyTheme();

  root.innerHTML=`
    <div class="auth-shell">
      <div class="auth-card">

        <div class="auth-logo">M</div>

        <h1>Marvel Chat</h1>

        <p>
          A futuristic community for people to connect,
          chat, exchange skills and discover opportunities.
        </p>

        <div id="authMessage"></div>

        <div class="segmented">
          <button class="btn btn-primary" id="loginTab">
            Sign in
          </button>

          <button class="btn btn-ghost" id="signupTab">
            Create account
          </button>
        </div>

        <form id="authForm">

          <div class="field">
            <label>Email</label>
            <input
              class="input"
              id="authEmail"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="field">
            <label>Password</label>
            <input
              class="input"
              id="authPassword"
              type="password"
              autocomplete="current-password"
              placeholder="Your password"
              minlength="6"
              required
            >
          </div>

          <div id="signupFields" class="hidden">

            <div class="field">
              <label>Username</label>
              <input
                class="input"
                id="authUsername"
                placeholder="Choose a username"
              >
            </div>

            <div class="field">
              <label>Display name</label>
              <input
                class="input"
                id="authDisplayName"
                placeholder="Your name"
              >
            </div>

          </div>

          <button
            class="btn btn-primary btn-block"
            id="authSubmit"
            type="submit"
          >
            Sign in
          </button>

        </form>

        <div class="notice" style="margin-top:15px">
          🚀 Your account is powered by Firebase Authentication.
        </div>

      </div>
    </div>
  `;

  let signup=false;

  const loginTab=document.getElementById("loginTab");
  const signupTab=document.getElementById("signupTab");
  const signupFields=document.getElementById("signupFields");
  const submit=document.getElementById("authSubmit");

  function setMode(v){

    signup=v;

    loginTab.className=v
      ? "btn btn-ghost"
      : "btn btn-primary";

    signupTab.className=v
      ? "btn btn-primary"
      : "btn btn-ghost";

    signupFields.classList.toggle("hidden",!v);

    submit.textContent=v
      ? "Create account"
      : "Sign in";
  }

  loginTab.addEventListener("click",()=>{
    setMode(false);
  });

  signupTab.addEventListener("click",()=>{
    setMode(true);
  });

  document.getElementById("authForm")
    .addEventListener("submit",async e=>{

      e.preventDefault();

      const email=
        document.getElementById("authEmail").value.trim();

      const password=
        document.getElementById("authPassword").value;

      const message=
        document.getElementById("authMessage");

      submit.disabled=true;
      submit.textContent="Connecting…";

      try{

        if(signup){

          const username=
            document
              .getElementById("authUsername")
              .value.trim();

          const displayName=
            document
              .getElementById("authDisplayName")
              .value.trim();

          if(!username){
            throw new Error("Username is required.");
          }

          const cred=
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          await updateProfile(
            cred.user,
            {
              displayName:
                displayName || username
            }
          );

          await setDoc(
            doc(db,"users",cred.user.uid),
            {
              uid:cred.user.uid,
              displayName:displayName || username,
              username,
              email,
              country:"",
              bio:"",
              createdAt:serverTimestamp()
            },
            {merge:true}
          );

          toast("Account created successfully 🚀");

        }else{

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          toast("Welcome back 👋");
        }

      }catch(err){

        message.innerHTML=
          `<div class="status error">
            ${escapeHtml(friendly(err))}
          </div>`;

      }finally{

        submit.disabled=false;
        submit.textContent=
          signup
            ? "Create account"
            : "Sign in";
      }
    });
}

async function toggleLike(id){

  const post=state.posts.find(x=>x.id===id);

  if(!post)return;

  const liked=
    Array.isArray(post.likedBy) &&
    post.likedBy.includes(state.user.uid);

  try{

    await updateDoc(
      doc(db,"posts",id),
      {
        likes:increment(liked ? -1 : 1),
        likedBy:
          liked
            ? arrayRemove(state.user.uid)
            : arrayUnion(state.user.uid)
      }
    );

  }catch(e){
    toast(friendly(e));
  }
}


async function savePost(id){

  const post=state.posts.find(x=>x.id===id);

  if(!post)return;

  const saved=
    Array.isArray(post.savedBy) &&
    post.savedBy.includes(state.user.uid);

  try{

    await updateDoc(
      doc(db,"posts",id),
      {
        savedBy:
          saved
            ? arrayRemove(state.user.uid)
            : arrayUnion(state.user.uid)
      }
    );

    toast(
      saved
        ? "Removed from saved posts."
        : "Saved to your vault 🔖"
    );

  }catch(e){
    toast(friendly(e));
  }
}


async function sharePost(id){

  const post=state.posts.find(x=>x.id===id);

  if(!post)return;

  const text=
    `${post.username || "Someone"} on Marvel Chat:\n\n${post.text}`;

  try{

    if(navigator.share){

      await navigator.share({
        title:"Marvel Chat",
        text
      });

    }else{

      await navigator.clipboard.writeText(text);

      toast("Post copied to clipboard 📋");
    }

  }catch(e){

    if(e?.name!=="AbortError"){
      toast("Could not share this post.");
    }
  }
}

            `<div class="empty">
              No user found.
            </div>`;

          return;
        }

        result.innerHTML=
          snap.docs
            .filter(d=>d.id!==state.user.uid)
            .map(d=>{

              const u={
                id:d.id,
                ...d.data()
              };

              return `
                <div class="list-item">

                  <div class="profile-row">

                    <div class="avatar">
                      ${escapeHtml(
                        initials(
                          u.displayName ||
                          u.username
                        )
                      )}
                    </div>

                    <div class="profile-meta">

                      <strong>
                        ${escapeHtml(
                          u.displayName ||
                          u.username ||
                          "User"
                        )}
                      </strong>

                      <span class="small">
                        @${escapeHtml(
                          u.username || ""
                        )}
                      </span>

                    </div>

                    <button
                      class="btn btn-primary"
                      data-start-chat="${u.id}"
                    >
                      Chat
                    </button>

                  </div>

                </div>
              `;
            })
            .join("");

        result
          .querySelectorAll("[data-start-chat]")
          .forEach(btn=>{

            btn.addEventListener("click",async()=>{

              const uid=btn.dataset.startChat;

              const snap=await getDoc(
                doc(db,"users",uid)
              );

              if(!snap.exists()){
                toast("User profile disappeared.");
                return;
              }

              await createConversation({
                uid,
                ...snap.data()
              });
            });
          });

      }catch(e){

        result.innerHTML=
          `<div class="status error">
            ${escapeHtml(friendly(e))}
          </div>`;
      }
    });
}


async function createConversation(other){

  try{

    const existing=
      state.conversations.find(c=>
        Array.isArray(c.participants) &&
        c.participants.includes(other.uid)
      );

    if(existing){

      closeModal();

      openConversation(existing.id);

      return;
    }

    const ref=await addDoc(
      collection(db,"conversations"),
      {
        participants:[
          state.user.uid,
          other.uid
        ],
        participantProfiles:{
          [state.user.uid]:{
            displayName:
              state.profile.displayName ||
              state.profile.username ||
              "User",
            username:
              state.profile.username || ""
          },

          [other.uid]:{
            displayName:
              other.displayName ||
              other.username ||
              "User",
            username:
              other.username || ""
          }
        },
        lastMessage:"",
        updatedAt:serverTimestamp(),
        createdAt:serverTimestamp()
      }
    );

    closeModal();

    await openConversation(ref.id);

  }catch(e){

    toast(friendly(e));
  }
}


async function openConversation(id){

  const c=
    state.conversations.find(x=>x.id===id);

  if(!c)return;

  state.activeConversation=c;
  state.messages=[];

  state.unsubs.messages?.();

  state.unsubs.messages=
    onSnapshot(
      query(
        collection(
          db,
          "conversations",
          id,
          "messages"
        ),
        orderBy("createdAt","asc"),
        limit(100)
      ),
      snap=>{

        state.messages=
          snap.docs.map(d=>({
            id:d.id,
            ...d.data()
          }));

        if(state.page==="chat"){
          render();

          setTimeout(()=>{
            const el=
              document.getElementById("messages");

            if(el){
              el.scrollTop=el.scrollHeight;
            }
          },50);
        }

      },
      err=>{
        toast(friendly(err));
      }
    );

  state.page="chat";

  render();
}


async function sendMessage(){

  const input=
    document.getElementById("messageInput");

  const text=input?.value.trim();

  if(!text || !state.activeConversation){
    return;
  }

  const id=state.activeConversation.id;

  try{

    input.disabled=true;

    await addDoc(
      collection(
        db,
        "conversations",
        id,
        "messages"
      ),
      {
        uid:state.user.uid,
        text,
        createdAt:serverTimestamp()
      }
    );

    await updateDoc(
      doc(db,"conversations",id),
      {
        lastMessage:text,
        updatedAt:serverTimestamp()
      }
    );

    input.value="";

  }catch(e){

    toast(friendly(e));

  }finally{

    input.disabled=false;
    input.focus();
  }
}

          ? "Low-data mode enabled 📶"
          : "Low-data mode disabled."
      );

      closeModal();
      showSettings();
    });


  document
    .getElementById("settingsInstall")
    ?.addEventListener(
      "click",
      installPwa
    );


  document
    .getElementById("reportProblemBtn")
    ?.addEventListener(
      "click",
      showReportProblem
    );
}


function showReportProblem(){

  showModal(
    "Report a problem",
    `
      <div class="field">

        <label>
          What went wrong?
        </label>

        <textarea
          class="textarea"
          id="problemText"
          maxlength="1000"
          placeholder="Tell us what happened…"
        ></textarea>

      </div>

      <button
        class="btn btn-primary btn-block"
        id="submitProblem"
      >
        Send report
      </button>
    `
  );

  document
    .getElementById("submitProblem")
    ?.addEventListener("click",async()=>{

      const text=
        document
          .getElementById("problemText")
          .value.trim();

      if(!text){
        toast("Describe the problem first.");
        return;
      }

      try{

        await addDoc(
          collection(
            db,
            "users",
            state.user.uid,
            "notifications"
          ),
          {
            title:"Problem report",
            message:text,
            createdAt:serverTimestamp()
          }
        );

        closeModal();

        toast(
          "Report saved. Thank you."
        );

      }catch(e){

        toast(friendly(e));
      }
    });
}


async function showNotifications(){

  showModal(
    "Notifications",
    `
      <div
        id="notificationContent"
        class="empty"
      >
        Loading notifications…
      </div>
    `
  );

  try{

    const snap=await getDocs(
      query(
        collection(
          db,
          "users",
          state.user.uid,
          "notifications"
        ),
        orderBy("createdAt","desc"),
        limit(30)
      )
    );

    const arr=
      snap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

    const el=
      document.getElementById(
        "notificationContent"
      );

    if(!el)return;

    el.className=
      arr.length
        ? "list"
        : "empty";

    el.innerHTML=
      arr.length
        ? arr.map(n=>`
            <div class="list-item">

              <strong>
                ${escapeHtml(
                  n.title ||
                  "Notification"
                )}
              </strong>

              <div>
                ${escapeHtml(
                  n.message || ""
                )}
              </div>

              <div class="small">
                ${escapeHtml(
                  formatDate(
                    n.createdAt
                  )
                )}
              </div>

            </div>
          `).join("")
        : `
          🔔
          <p>
            No notifications yet.
          </p>
        `;

  }catch(e){

    document.getElementById(
      "notificationContent"
    ).innerHTML=
      `<div class="status error">
        ${escapeHtml(friendly(e))}
      </div>`;
  }
}


function showSearch(){

  showModal(
    "Search Marvel Chat",
    `
      <div class="field">

        <input
          id="globalSearch"
          class="input"
          placeholder="Search loaded community posts…"
        >

      </div>

      <button
        class="btn btn-primary btn-block"
        id="runSearch"
      >
        Search
      </button>

      <div
        id="searchResults"
        style="margin-top:15px"
      ></div>
    `
  );

  document
    .getElementById("runSearch")
    ?.addEventListener("click",()=>{

      const t=
        document
          .getElementById("globalSearch")
          ?.value
          .trim()
          .toLowerCase();

      if(!t)return;

      const r=
        state.posts.filter(p=>
          `${p.text || ""} ${p.username || ""}`
            .toLowerCase()
            .includes(t)
        );

      document.getElementById(
        "searchResults"
      ).innerHTML=
        r.length
          ? r.map(p=>`
              <div class="list-item">

                <strong>
                  ${escapeHtml(
                    p.username ||
                    "User"
                  )}
                </strong>

                <div>
                  ${escapeHtml(
                    p.text || ""
                  )}
                </div>

              </div>
            `).join("")
          : `
            <div class="empty">
              No matching posts found.
            </div>
          `;
    });
}


async function installPwa(){

  if(state.installPrompt){

    state.installPrompt.prompt();

    const result=
      await state.installPrompt.userChoice;

    if(result.outcome==="accepted"){
      toast("Marvel Chat installed 📲");
    }

    state.installPrompt=null;

    closeModal();

    return;
  }

  toast(
    "If your browser supports installation, use its browser menu and choose Install app."
  );
}


function attachEvents(){

  if(state.page==="home"){

    document
      .getElementById("createPostBtn")
      ?.addEventListener(
        "click",
        showCreatePost
      );

    document
      .getElementById("emptyCreatePost")
      ?.addEventListener(
        "click",
        showCreatePost
      );

    document
      .querySelectorAll("[data-like]")
      .forEach(b=>
        b.addEventListener(
          "click",
          ()=>toggleLike(
            b.dataset.like
          )
        )
      );

    document
      .querySelectorAll("[data-comment]")
      .forEach(b=>
        b.addEventListener(
          "click",
          ()=>showComments(
            b.dataset.comment
          )
        )
      );

    document
      .querySelectorAll("[data-share]")
      .forEach(b=>
        b.addEventListener(
          "click",
          ()=>sharePost(
            b.dataset.share
          )
        )
      );

    document
      .querySelectorAll("[data-save]")
      .forEach(b=>
        b.addEventListener(
          "click",
          ()=>savePost(
            b.dataset.save
          )
        )
      );

    document
      .querySelectorAll("[data-quick]")
      .forEach(b=>
        b.addEventListener("click",()=>{

          const a=b.dataset.quick;

          if(a==="post"){
            showCreatePost();
          }

          if(a==="chat"){

            state.page="chat";

            render();

            setTimeout(
              showNewChat,
              50
            );
          }

          if(a==="skill"){
            showSkillModal("offer");
          }

          if(a==="sell"){
            showSellModal();
          }

        })
      );
  }


  if(state.page==="chat"){

    if(state.activeConversation){

      document
        .getElementById("backChats")
        ?.addEventListener(
          "click",
          ()=>{
            state.unsubs.messages?.();
            state.unsubs.messages=null;
            state.activeConversation=null;
            state.messages=[];
            render();
          }
        );

      document
        .getElementById("sendMessage")
        ?.addEventListener(
          "click",
          sendMessage
        );

      document
        .getElementById("messageInput")
        ?.addEventListener(
          "keydown",
          e=>{
            if(e.key==="Enter"){
              e.preventDefault();
              sendMessage();
            }
          }
        );

    }else{

      document
        .getElementById("newChatBtn")
        ?.addEventListener(
          "click",
          showNewChat
        );

      document
        .getElementById("newChatEmpty")
        ?.addEventListener(
          "click",
          showNewChat
        );

      document
        .querySelectorAll(
          "[data-conversation]"
        )
        .forEach(x=>
          x.addEventListener(
            "click",
            ()=>openConversation(
              x.dataset.conversation
            )
          )
        );

      document
        .getElementById("chatSearch")
        ?.addEventListener(
          "input",
          e=>{

            state.search=
              e.target.value.toLowerCase();

            const list=
              document.getElementById(
                "chatList"
              );

            const filtered=
              state.conversations.filter(c=>
                Object.values(
                  c.participantProfiles || {}
                )
                .map(p=>
                  `${p.displayName || ""} ${
                    p.username || ""
                  }`
                )
                .join(" ")
                .toLowerCase()
                .includes(
                  state.search
                )
              );

            if(!list)return;

            list.innerHTML=
              filtered.length
                ? filtered.map(c=>{

                    const o=
                      c.participants?.find(
                        x=>x!==state.user.uid
                      ) || "";

                    const p=
                      c.participantProfiles?.[o]
                      || {};

                    const n=
                      p.displayName ||
                      p.username ||
                      "User";

                    return `
                      <div
                        class="chat-item"
                        data-conversation="${c.id}"
                      >

                        <div class="avatar">
                          ${escapeHtml(
                            initials(n)
                          )}
                        </div>

                        <div class="chat-content">

                          <strong>
                            ${escapeHtml(n)}
                          </strong>

                          <p>
                            ${escapeHtml(
                              c.lastMessage ||
                              "Start chatting"
                            )}
                          </p>

                        </div>

                      </div>
                    `;
                  }).join("")
                : `
                  <div class="empty">
                    No matching conversations.
                  </div>
                `;

            list
              .querySelectorAll(
                "[data-conversation]"
              )
              .forEach(x=>
                x.addEventListener(
                  "click",
                  ()=>openConversation(
                    x.dataset.conversation
                  )
                )
              );
          }
        );
    }
  }


  if(state.page==="timetrust"){

    document
      .getElementById("offerSkillBtn")
      ?.addEventListener(
        "click",
        ()=>showSkillModal("offer")
      );

    document
      .getElementById("requestSkillBtn")
      ?.addEventListener(
        "click",
        ()=>showSkillModal("request")
      );

    document
      .querySelectorAll("[data-time-tab]")
      .forEach(b=>
        b.addEventListener(
          "click",
          ()=>{
            state.timeTab=
              b.dataset.timeTab;

            render();
          }
        )
      );
  }


  if(state.page==="market"){

    document
      .getElementById("sellBtn")
      ?.addEventListener(
        "click",
        showSellModal
      );

    document
      .getElementById("marketSearch")
      ?.addEventListener(
        "input",
        e=>{

          state.search=e.target.value;

          const el=
            document.getElementById(
              "marketItems"
            );

          if(!el)return;

          const filtered=
            state.listings.filter(x=>
              `${x.title || ""} ${
                x.description || ""
              } ${
                x.username || ""
              }`
              .toLowerCase()
              .includes(
                state.search.toLowerCase()
              )
              &&
              (
                state.marketCategory==="all" ||
                x.category===
                  state.marketCategory
              )
            );

          el.innerHTML=
            filtered.length
              ? `
                <div class="list">

                  ${filtered.map(x=>`

                    <div class="list-item">

                      <div class="profile-row">

                        <div class="avatar">
                          🛍
                        </div>

                        <div class="profile-meta">

                          <strong>
                            ${escapeHtml(
                              x.title
                            )}
                          </strong>

                          <span class="small">
                            ${escapeHtml(
                              x.username ||
                              "User"
                            )}
                            ·
                            ${escapeHtml(
                              x.country ||
                              "Community"
                            )}
                          </span>

                        </div>

                        <strong>
                          ${escapeHtml(
                            String(
                              x.price ?? 0
                            )
                          )}
                        </strong>

                      </div>

                      <p class="small">
                        ${escapeHtml(
                          x.description || ""
                        )}
                      </p>

                      <span class="badge">
                        ${escapeHtml(
                          x.category ||
                          "Other"
                        )}
                      </span>

                    </div>

                  `).join("")}

                </div>
              `
              : `
                <div class="empty">
                  No matching listings.
                </div>
              `;
        }
      );

    document
      .querySelectorAll("[data-category]")
      .forEach(b=>
        b.addEventListener(
          "click",
          ()=>{
            state.marketCategory=
              b.dataset.category;

            render();
          }
        )
      );
  }


  if(state.page==="profile"){

    document
      .getElementById("editProfileBtn")
      ?.addEventListener(
        "click",
        showEditProfile
      );

    document
      .getElementById("savedBtn")
      ?.addEventListener(
        "click",
        showSaved
      );

    document
      .getElementById("settingsBtn")
      ?.addEventListener(
        "click",
        showSettings
      );

    document
      .getElementById("logoutBtn")
      ?.addEventListener(
        "click",
        ()=>signOut(auth)
      );
  }
}


function sub(name,q,handler){

  state.unsubs[name]?.();

  state.unsubs[name]=
    onSnapshot(
      q,
      s=>handler(s),
      e=>{
        console.error(
          name,
          e
        );

        toast(friendly(e));
      }
    );
}


function subscribeAll(){

  sub(
    "posts",
    query(
      collection(db,"posts"),
      orderBy("createdAt","desc"),
      limit(50)
    ),
    s=>{
      state.posts=
        s.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

      if(state.page==="home"){
        render();
      }
    }
  );


  sub(
    "conversations",
    query(
      collection(
        db,
        "conversations"
      ),
      where(
        "participants",
        "array-contains",
        state.user.uid
      ),
      orderBy(
        "updatedAt",
        "desc"
      ),
      limit(50)
    ),
    s=>{

      state.conversations=
        s.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

      if(
        state.page==="chat" &&
        !state.activeConversation
      ){
        render();
      }
    }
  );


  sub(
    "listings",
    query(
      collection(
        db,
        "listings"
      ),
      where(
        "status",
        "==",
        "active"
      ),
      orderBy(
        "createdAt",
        "desc"
      ),
      limit(50)
    ),
    s=>{

      state.listings=
        s.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

      if(state.page==="market"){
        render();
      }
    }
  );


  sub(
    "skills",
    query(
      collection(
        db,
        "skills"
      ),
      orderBy(
        "createdAt",
        "desc"
      ),
      limit(50)
    ),
    s=>{

      state.skills=
        s.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

      if(state.page==="timetrust"){
        render();
      }
    }
  );


  sub(
    "requests",
    query(
      collection(
        db,
        "skillRequests"
      ),
      orderBy(
        "createdAt",
        "desc"
      ),
      limit(50)
    ),
    s=>{

      state.requests=
        s.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));

      if(state.page==="timetrust"){
        render();
      }
    }
  );
}


async function startApplication(user){

  state.user=user;

  try{

    await loadProfile(user);

    subscribeAll();

    render();

  }catch(e){

    root.innerHTML=`
      <div class="auth-shell">

        <div class="auth-card">

          <div class="auth-logo">
            !
          </div>

          <h1>
            Connection problem
          </h1>

          <p>
            Marvel Chat could not load your profile.
          </p>

          <div class="status error">
            ${escapeHtml(
              friendly(e)
            )}
          </div>

          <button
            class="btn btn-primary btn-block"
            id="retryApp"
          >
            Retry
          </button>

          <div style="height:8px"></div>

          <button
            class="btn btn-danger btn-block"
            id="retryLogout"
          >
            Sign out
          </button>

        </div>

      </div>
    `;

    document
      .getElementById("retryApp")
      ?.addEventListener(
        "click",
        ()=>startApplication(user)
      );

    document
      .getElementById("retryLogout")
      ?.addEventListener(
        "click",
        ()=>signOut(auth)
      );
  }
}


onAuthStateChanged(
  auth,
  async user=>{

    state.user=user;

    if(!user){

      Object
        .values(state.unsubs)
        .forEach(
          fn=>fn?.()
        );

      state.unsubs={
        posts:null,
        conversations:null,
        messages:null,
        skills:null,
        requests:null,
        listings:null
      };

      state.profile=null;
      state.posts=[];
      state.conversations=[];
      state.skills=[];
      state.requests=[];
      state.listings=[];
      state.activeConversation=null;

      renderAuth();

      return;
    }

    await startApplication(user);
  }
);


window.addEventListener(
  "online",
  ()=>{
    if(state.user){
      toast("Back online ⚡");
      render();
    }
  }
);


window.addEventListener(
  "offline",
  ()=>{
    if(state.user){
      toast(
        "Offline mode. Some features may be unavailable."
      );
      render();
    }
  }
);


window.addEventListener(
  "beforeinstallprompt",
  e=>{
    e.preventDefault();
    state.installPrompt=e;
  }
);


window.addEventListener(
  "appinstalled",
  ()=>{
    state.installPrompt=null;
    toast(
      "Marvel Chat installed 📲"
    );
  }
);


if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register(
  "./serviceworker.js",
  {
    scope:"./",
    updateViaCache:"none"
  }
)

  
           .then(r=>{
          console.log(
            "Service worker:",
            r.scope
          );
        })
        .catch(e=>{
          console.warn(
            "Service worker:",
            e
          );
        });
    }
  );
}


const startupStatus=
  document.getElementById(
    "startupStatus"
  );

if(startupStatus){

  startupStatus.textContent=
    "Initializing the Marvel Chat universe…";
}

</script>
